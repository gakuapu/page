<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XKL20YHCTB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XKL20YHCTB');
  </script>
  <meta charset="utf-8">
  <meta name="theme-color" content="#f5f1e6">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>野球部シム｜無料で遊べる高校野球育成ブラウザゲーム</title>
  <meta name="description" content="
    無料・ダウンロード不要の高校野球シミュレーションゲーム。監督となって選手を育成し、甲子園を目指そう！練習メニューの設定や選手選考、打順、試合中の采配まで、ブラウザですぐに楽しめます。
    ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      /* 生成りの地・墨の文字・紺を主役に、縫い目の赤を差し色にする */
      --bg: #f5f1e6;
      --card: #fffdf8;
      --ink: #1f2433;
      --sub: #656a77;
      --line: #e8e2d1;
      --edge: #d9d2bd;
      --navy: #1e3a6d;
      --navy-d: #152b54;
      --navy-t: #e7ecf6;
      --red: #c4372c;
      --red-t: #fbece9;
      --amber: #d99f1a;
      --bad: #c4372c;
      --good: #2f8a4e;
      --fg: #4fae5f;
      --fy: #e3b81c;
      --fo: #e8782a;
      --board: #17291f;
      --board-ink: #f2c94c;
      --board-line: #2c4a39;
      --shadow: 0 1px 2px rgba(48, 40, 16, .06), 0 4px 14px rgba(48, 40, 16, .04);
      --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      --disp: var(--font);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 var(--font);
      -webkit-text-size-adjust: 100%
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 44px
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.3
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 10px;
      padding: 1px 0 1px 10px;
      border-left: 4px solid var(--navy);
      font-family: var(--disp);
      font-weight: 900;
      font-size: 16px;
      color: var(--ink)
    }

    h2 .ic {
      flex: none;
      width: 17px;
      height: 17px;
      color: var(--navy)
    }

    h2 .ht {
      flex: 1;
      min-width: 0
    }

    .title {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 21px;
      color: var(--ink)
    }

    .tag,
    .onbg {
      color: var(--sub);
      font-size: 13px;
      font-weight: 500
    }

    .card {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow)
    }

    .sub {
      color: var(--sub);
      font-size: 13px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .between {
      justify-content: space-between
    }

    .wrap {
      flex-wrap: wrap
    }

    .grow {
      flex: 1
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    /* ボタン:通常はフラット。主要操作(primary)だけを紺で塗る */
    .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
      text-align: center;
      transition: background .12s, border-color .12s
    }

    a.btn {
      text-decoration: none
    }

    .btn:active {
      background: var(--navy-t);
      border-color: var(--navy)
    }

    .btn.primary {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 2px 0 var(--navy-d)
    }

    .btn.primary:active {
      background: var(--navy-d);
      transform: translateY(1px);
      box-shadow: none
    }

    .btn.amber {
      background: var(--red-t);
      border-color: #e2b3ad;
      color: #9b2a21
    }

    .btn.amber:active {
      background: #f6d9d5;
      border-color: var(--red)
    }

    .btn.sm {
      min-height: 0;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
      border-radius: 8px
    }

    .btn:focus-visible,
    select:focus-visible,
    input:focus-visible,
    .info:focus-visible,
    [data-act="open"]:focus-visible,
    .opt:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: 2px
    }

    .btn[disabled] {
      opacity: .4
    }

    .opt {
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 10px;
      text-align: left;
      position: relative
    }

    .opt b {
      display: block;
      font-size: 14px
    }

    .opt span {
      font-size: 12px;
      color: var(--sub);
      line-height: 1.4;
      display: block
    }

    .opt:active {
      background: var(--navy-t)
    }

    .opt.on {
      border-color: var(--navy);
      background: var(--navy-t);
      box-shadow: inset 0 0 0 1px var(--navy)
    }

    .opt.on span {
      color: #3b4c72
    }

    .opt.on::after {
      content: "✔";
      position: absolute;
      right: 8px;
      top: 6px;
      font-weight: 900;
      color: var(--navy)
    }

    .seg {
      display: flex;
      border: 1px solid var(--edge);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card)
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 8px 4px;
      font-weight: 700;
      color: var(--sub)
    }

    .seg button+button {
      border-left: 1px solid var(--edge)
    }

    .seg button.on {
      background: var(--navy);
      color: #fff
    }

    select,
    input[type=text] {
      font: inherit;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--edge);
      background: #fff;
      color: var(--ink);
      font-weight: 500
    }

    select.rest {
      background: #e4f3e7;
      border-color: #8cc79b;
      color: #1f6b3a;
      font-weight: 700
    }

    /* 能力ランク:階級そのものが情報なので、色はフラットに */
    .rk {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.5em;
      border-radius: 50%;
      font-weight: 900;
      font-size: 12px;
      line-height: 1;
      color: #fff;
      background: #8d97ab;
      vertical-align: middle
    }

    .rkS {
      background: #e0a419;
      color: #4a3300
    }

    .rkA {
      background: #d9473a
    }

    .rkB {
      background: #e8832a
    }

    .rkC {
      background: #e3bd2a;
      color: #4a3a00
    }

    .rkD {
      background: #5eaa3c
    }

    .rkE {
      background: #2d9f98
    }

    .rkF {
      background: #4a7fd6
    }

    .rkG {
      background: #8d97ab
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    .bar {
      height: 8px;
      border-radius: 4px;
      background: #ebe5d4;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--navy)
    }

    .bar.fat i {
      background: var(--fg)
    }

    .bar.fat.y i {
      background: var(--fy)
    }

    .bar.fat.o i {
      background: var(--fo)
    }

    .pos {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8em;
      height: 1.8em;
      border-radius: 6px;
      background: var(--navy);
      color: #fff;
      font-weight: 900;
      font-size: 12.5px
    }

    .pos[data-p="投"] {
      background: #c4372c
    }

    .pos[data-p="捕"] {
      background: #d9772a
    }

    .pos[data-p="指"] {
      background: #7a4fc4
    }

    .badge.gem {
      background: #f8efcf;
      color: #6a4a00;
      border-color: #e6d28a
    }

    table.cmp {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    table.cmp th,
    table.cmp td {
      padding: 6px 3px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    table.cmp th {
      background: #f0ebdb;
      font-weight: 700;
      padding: 2px
    }

    table.cmp .thb {
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 700;
      padding: 5px 3px;
      color: var(--ink);
      width: 100%
    }

    table.cmp .nm {
      text-align: left;
      white-space: nowrap
    }

    table.cmp td.mk {
      width: 2.6em;
      font-weight: 700;
      font-size: 11px;
      color: var(--sub)
    }

    table.cmp tbody tr {
      cursor: pointer
    }

    table.cmp tbody tr:active {
      background: var(--navy-t)
    }

    table.cmp tr.on td {
      background: #f6ecc8
    }

    table.cmp tr.cur td {
      background: #f2e3a8
    }

    table.cmp td.n {
      font-variant-numeric: tabular-nums;
      font-weight: 500
    }

    table.cmp td.best {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
      font-weight: 900
    }

    table.cmp tr.pin td {
      background: #f2e3a8;
      font-weight: 900;
      border-bottom: 2px solid var(--navy)
    }

    table.cmp tr.pin {
      cursor: default
    }

    table.cmp td.hl,
    table.cmp th.hl {
      box-shadow: inset 0 0 0 2px var(--navy)
    }

    .fm-g {
      background: #4fae5f33
    }

    .fm-o {
      background: #e8782a44
    }

    .fc-g {
      background: #4fae5f33
    }

    .fc-y {
      background: #e3b81c44
    }

    .fc-o {
      background: #e8782a44
    }

    .ctl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .ctl .btn {
      min-height: 48px;
      padding: 10px 8px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .ctl+.ctl {
      margin-top: 10px
    }

    .crow {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 10px;
      align-items: center
    }

    .crow.two {
      grid-template-columns: repeat(2, 1fr) auto
    }

    .crow .btn {
      min-height: 48px;
      padding: 4px 6px;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      line-height: 1.2
    }

    .crow .btn small {
      font-size: 11px;
      font-weight: 500;
      color: var(--sub);
      white-space: nowrap
    }

    .crow .btn small b {
      font-weight: 900;
      color: var(--ink)
    }

    .crow .btn small b.good {
      color: var(--good)
    }

    .crow .btn small b.bad {
      color: var(--bad)
    }

    .dfoot {
      position: sticky;
      z-index: 10;
      bottom: -16px;
      margin: 12px -16px -16px;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--card);
      border-top: 1px solid var(--edge)
    }

    .sect td {
      background: #f0ebdb;
      font-weight: 700;
      text-align: left !important;
      padding: 4px 8px !important;
      font-size: 12px;
      color: var(--sub)
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap: 10px
    }

    .opts .opt {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 2px;
      padding: 12px 12px;
      min-height: 68px
    }

    .orow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      color: var(--ink)
    }

    .orow .on1 {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0
    }

    .orow .ono {
      width: 2.2em
    }

    .orow b {
      white-space: nowrap
    }

    .orow.sel {
      background: #f8ecb8;
      box-shadow: inset 3px 0 0 var(--amber)
    }

    .orow:active {
      background: var(--navy-t)
    }

    .orow:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: -2px
    }

    .coach {
      margin: 14px 0 0
    }

    .coach .ch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 12px;
      color: var(--sub)
    }

    .coach .ch b {
      color: var(--ink);
      font-size: 13px;
      margin-right: 6px
    }

    .log .chg {
      background: #e4f3e7;
      color: #1f5a33;
      font-weight: 700;
      font-size: 13px
    }

    .tg {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--edge);
      border-radius: 999px;
      padding: 0 8px;
      line-height: 1.6;
      white-space: nowrap;
      background: #f4efe0;
      color: var(--sub)
    }

    .tg.s {
      background: #f8efcf;
      border-color: #e6d28a;
      color: #6a4a00
    }

    .tg.b {
      background: var(--navy-t);
      border-color: #c4d0e8;
      color: var(--navy)
    }

    .tg.rest {
      background: #e4f3e7;
      border-color: #9fd0aa;
      color: #1f6b3a;
      font-weight: 900
    }

    .chk {
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--edge);
      border-radius: 999px;
      padding: 1px 10px;
      background: var(--card);
      color: var(--sub);
      white-space: nowrap
    }

    .chk.on {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff
    }

    .prow {
      border-bottom: 1px solid var(--line);
      padding: 9px 0
    }

    .prow:last-child {
      border-bottom: 0
    }

    .prow.rest {
      background: #f1f8f2;
      margin: 0 -12px;
      padding: 9px 12px
    }

    .up {
      color: var(--good)
    }

    .down {
      color: var(--bad)
    }

    .badge {
      font-size: 11px;
      font-weight: 900;
      border-radius: 6px;
      padding: 0 6px;
      background: var(--red-t);
      color: var(--red);
      border: 1px solid #e2b3ad
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
      margin-top: 10px
    }

    .stat .l {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--sub);
      font-weight: 500
    }

    .stat .l b {
      color: var(--ink);
      font-size: 14px
    }

    /* タイトル画面・節目の画面 */
    .hero {
      position: relative;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 28px 16px 22px;
      text-align: center;
      margin: 6px 0 16px;
      box-shadow: var(--shadow)
    }

    .hero h1 {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 42px;
      letter-spacing: .1em;
      color: var(--navy)
    }

    .hero p {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--sub);
      letter-spacing: .14em
    }

    .hero svg {
      display: block;
      margin: 0 auto 8px;
      animation: bob 2.4s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-5px) rotate(8deg)
      }
    }

    /* 各画面の見出しブロック */
    .ph {
      margin: 2px 0 16px;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--edge)
    }

    .ph .t {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 22px;
      line-height: 1.3
    }

    .ph .s {
      font-size: 13px;
      color: var(--sub);
      margin-top: 2px
    }

    /* スコアボード:この画面でだけ濃い色を使う */
    .sb {
      background: var(--board);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--board-ink);
      overflow-x: auto;
      box-shadow: var(--shadow)
    }

    .sb table {
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      width: 100%;
      min-width: 0
    }

    .sb th,
    .sb td {
      text-align: center;
      padding: 4px 2px;
      font-weight: 700;
      font-size: 14px
    }

    .sb th {
      color: #9fb8a7;
      font-size: 12px;
      font-weight: 500
    }

    .sb td.tn {
      text-align: left;
      white-space: nowrap;
      max-width: 5.5em;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eaf4ec;
      font-weight: 500
    }

    .sb td.tot {
      border-left: 1px solid var(--board-line)
    }

    .sb td.cur {
      background: rgba(242, 201, 76, .2)
    }

    .tl {
      display: flex;
      gap: 3px;
      margin-top: 10px
    }

    .tl i {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--line)
    }

    .tl i.k {
      margin-left: 6px
    }

    .tl i.c {
      background: #f1cfc9
    }

    .tl i.done {
      background: var(--navy)
    }

    .tl i.now {
      background: var(--red)
    }

    .sit {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .outs {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub)
    }

    .outs i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid var(--sub);
      background: transparent
    }

    .outs i.on {
      background: var(--red);
      border-color: var(--red)
    }

    .outs span {
      margin-left: 3px;
      letter-spacing: .08em
    }

    .log {
      max-height: 340px;
      overflow: auto;
      border: 1px solid var(--edge);
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow)
    }

    .log div {
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 14px
    }

    .log .hdr {
      background: var(--navy-t);
      color: var(--navy);
      font-weight: 700;
      font-size: 13px
    }

    .log .run {
      font-weight: 700;
      color: var(--navy)
    }

    .log .us.run {
      color: var(--good)
    }

    .log .opp.run {
      color: var(--bad)
    }

    .log .hit {
      font-weight: 700
    }

    .log .end {
      background: #f8efcf;
      color: #5a4300;
      font-weight: 700
    }

    .report {
      border: 1px solid #e6d9a3;
      border-left: 4px solid var(--amber);
      background: #fbf5da;
      color: #4a3d10;
      padding: 9px 12px;
      border-radius: 10px;
      margin: 12px 0;
      font-size: 14px;
      font-weight: 500
    }

    .report div {
      padding: 1px 0
    }

    .vs {
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: 4px 10px;
      align-items: center;
      font-size: 14px
    }

    .vs .h {
      font-size: 12px;
      color: var(--sub)
    }

    table.bx {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px
    }

<body>
  <div id="app"></div>
  <div id="modal" hidden></div>
  <script>
    // ==ENGINE_START==
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const ri = (a, b) => Math.floor(rnd(a, b + 1));
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
    const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    function wpick(items, w) { let r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

    const POS = ['捕', '一', '二', '三', '遊', '左', '中', '右', '指'];
    const PN = { 指: '指名打者', 投: 'ピッチャー', 捕: 'キャッチャー', 一: 'ファースト', 二: 'セカンド', 三: 'サード', 遊: 'ショート', 左: 'レフト', 中: 'センター', 右: 'ライト' };
    const LBL = { meet: 'ミート', power: 'パワー', speed: '走力', field: '守備', infd: '内野守備', outf: '外野守備', velo: '球速', ctrl: '制球', brk: '変化球', stam: 'スタミナ' };
    const SUR = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤', '吉田', '山田', '佐々木', '山口', '松本', '井上', '木村', '林', '斎藤', '清水', '山崎', '森', '池田', '橋本', '阿部', '石川', '山下', '中島', '石井', '小川', '前田', '岡田', '長谷川', '藤田', '後藤', '近藤', '村上', '遠藤', '青木', '坂本', '福田', '西村', '三浦', '藤井', '岡本', '松田', '中川', '原田', '小野', '竹内'];
    const SCH = ['桜ヶ丘', '青葉台', '東雲', '北陽', '南海', '西京', '緑風', '白鷺', '朝日', '大和', '城東', '城南', '海星', '聖光', '明徳', '常盤', '千里', '瑞穂', '飛鳥', '八幡', '天城', '高砂', '若葉', '旭川', '双葉', '武蔵野', '鳳翔', '紫苑', '晴嵐', '双陵', '皇学', '岩城', '湊川', '丸山', '葵', '比叡', '大黒', '秋津', '玄海', '雲雀'];
    const SUF = ['高校', '高校', '高校', '学園', '商業', '工業', '実業', '学院'];
    function schoolNames(n, exclude) { const set = new Set([exclude]); const out = []; let g = 0; while (out.length < n && g++ < 2000) { const nm = pick(SCH) + pick(SUF); if (!set.has(nm)) { set.add(nm); out.push(nm); } } return out; }

    let UID = 1;
    const HANDL = { p: 0.15, b: 0.27 }; // 左投げの投手・左打ちの打者の割合
    const INF = new Set(['一', '二', '三', '遊']);
    const fieldKey = pos => pos === '捕' ? 'field' : INF.has(pos) ? 'infd' : 'outf';
    function keysOf(p) { return p.pos === '投' ? ['velo', 'ctrl', 'brk', 'stam'] : p.pos === '指' ? ['meet', 'power', 'speed'] : p.pos === '捕' ? ['meet', 'power', 'speed', 'field'] : ['meet', 'power', 'speed', 'infd', 'outf']; }
    const ap = (p, k) => (p.apt && p.apt[k]) || 1;
    function genPlayer(pos, base) {
      const g = (b, s = 9) => clamp(Math.round(b + gauss() * s), 15, 95);
      const bias = { 捕: { field: 4, speed: -6 }, 一: { power: 6, speed: -6, field: -2 }, 二: { field: 4, speed: 2 }, 三: { power: 3 }, 遊: { field: 6, speed: 3 }, 左: { power: 2 }, 中: { speed: 6, field: 3 }, 右: { power: 2 } }[pos] || {};
      const st = {};
      if (pos === '投') { st.velo = g(base + 2); st.ctrl = g(base); st.brk = g(base); st.stam = g(base + 2); }
      else if (pos === '指') { st.meet = g(base + 4); st.power = g(base + 5); st.speed = g(base - 8); }
      else if (pos === '捕') { for (const k of ['meet', 'power', 'speed', 'field']) st[k] = g(base + (bias[k] || 0)); }
      else {
        for (const k of ['meet', 'power', 'speed']) st[k] = g(base + (bias[k] || 0));
        const inf = INF.has(pos), fb = bias.field || 0;
        st.infd = g(base + fb + (inf ? 3 : -4)); st.outf = g(base + fb + (inf ? -4 : 3));
      }
      const p = { id: UID++, name: SUR[ri(0, SUR.length - 1)], pos, st, cap: {}, fatigue: 0, injured: 0, hand: Math.random() < (pos === '投' ? HANDL.p : HANDL.b) ? 'L' : 'R' };
      p.apt = {};
      for (const k of keysOf(p)) { p.cap[k] = Math.min(98, st[k] + ri(TUNE.room[0], TUNE.room[1])); p.apt[k] = rnd(0.75, 1.25); }
      return p;
    }
    function genTeam(name, base) {
      const players = POS.map(pos => genPlayer(pos, base)).concat([2, -4, -8].map(d => genPlayer('投', base + d)));
      const used = new Set(); players.forEach(p => { while (used.has(p.name)) p.name = SUR[ri(0, SUR.length - 1)]; used.add(p.name); });
      return { name, players, us: false, base };
    }
    // 左右の相性:打者のミート・パワーに掛ける倍率
    const HAND = { opp: 1.05, same: 0.95 };
    function handMul(b, p) {
      const bl = b.hand === 'L', pl = p.hand === 'L';
      return bl && pl ? HAND.same : (bl !== pl ? HAND.opp : 1);
    }
    function eff(p, k) { let m = 1 + ((p.form || 3) - 3) * 0.04 - p.fatigue * 0.0012; if (p.injured > 0) m *= 0.8; return p.st[k] * m; }
    function pscore(p, fat = true) { const f = fat ? (k => eff(p, k)) : (k => p.st[k]); return 0.4 * f('velo') + 0.3 * f('brk') + 0.3 * f('ctrl'); }
    function pnow(p, pc) {
      const thr = (60 + p.st.stam) * (1 - p.fatigue / 260), ratio = pc / thr;
      const tire = ratio > 0.7 ? clamp(1 - (ratio - 0.7) * 0.45, 0.55, 1) : 1;
      return pscore(p) * tire;
    }
    function autoOrder(players) {
      const sc = p => 0.5 * p.st.meet + 0.35 * p.st.power + 0.15 * p.st.speed;
      const a = players.filter(p => p.pos !== '投').sort((x, y) => sc(y) - sc(x));
      return [a[1], a[2], a[0], a[3], a[4], a[5], a[6], a[7], a[8]];
    }
    function lineup(t) {
      if (!t.order) t.order = autoOrder(t.players);
      if (!t.pits) t.pits = t.players.filter(p => p.pos === '投');
      t.pitcher = t.pits[0]; t.queue = t.pits.slice(1);
      t.hitters = t.order.slice(); t.order.forEach((w, i) => { w.bo = i; });
      t.usedIds = new Set(t.players.map(q => q.id));
      if (!t.bench) t.bench = [];
    }
    const DEFW = { 捕: 1, 一: 0.7, 二: 1.6, 三: 1, 遊: 1.8, 左: 1.2, 中: 2.2, 右: 1.2 };
    function wdef(list, get) { let a = 0, b = 0; list.forEach(p => { const w = DEFW[p.pos] || 1; a += w * get(p); b += w; }); return a / (b || 1); }
    function prepTeam(t) {
      const f = t.players.filter(p => p.pos !== '投' && p.pos !== '指');
      t.defAvg = wdef(f, p => eff(p, fieldKey(p.pos)));
    }
    function teamRates(t) {
      const P = t.players, hit = P.filter(p => p.pos !== '投'), f = hit.filter(p => p.pos !== '指');
      const ps = P.filter(p => p.pos === '投').map(p => 0.85 * pscore(p, false) + 0.15 * p.st.stam).sort((a, b) => b - a);
      const bat = avg(hit.map(p => 0.65 * p.st.meet + 0.35 * p.st.power));
      const cat = P.find(p => p.pos === '捕');
      const pit = (0.6 * ps[0] + 0.25 * ps[1] + 0.15 * ps[2]) * (1 + (cat.st.field - 50) * 0.0025);
      const def = wdef(f, p => p.st[fieldKey(p.pos)]);
      const run = avg(hit.map(p => p.st.speed));
      const ovr = 0.38 * bat + 0.32 * pit + 0.2 * def + 0.1 * run;
      const c = x => Math.min(99, x);
      return { bat: c(bat), pit: c(pit), def: c(def), run: c(run), ovr: c(ovr) };
    }

    // ---- game engine (plate-appearance level)
    function mkGame(tA, tB) {
      const g = { teams: [tA, tB], inn: 1, half: 0, outs: 0, bases: [null, null, null], sc: [0, 0], ls: [[], []], H: [0, 0], E: [0, 0], ord: [0, 0], pst: {}, bs: {}, fs: {}, log: [], over: false, winner: null };
      g.teams.forEach(t => { if (!t.us) t.players.forEach(p => { p.form = wpick([1, 2, 3, 4, 5], [10, 20, 40, 20, 10]); p.fatigue = 0; p.injured = 0; }); lineup(t); prepTeam(t); });
      hdr(g); return g;
    }
    function hdr(g) {
      Object.values(g.pst).forEach(z => { z.ri = 0; });
      g.ls[g.half][g.inn - 1] = 0;
      const t = g.teams[g.half];
      g.log.push({ k: 'hdr', t: `${g.inn}回${g.half ? '裏' : '表'}  ${t.name}${t.us ? '★' : ''}の攻撃` });
    }
    function force(g, b) {
      const B = g.bases; let runs = 0;
      if (B[0]) { if (B[1]) { if (B[2]) runs = 1; B[2] = B[1]; } B[1] = B[0]; }
      B[0] = b; return runs;
    }
    function hitAdv(g, b, type, ft) {
      const B = g.bases, N = [null, null, null]; let runs = 0;
      const sp = r => eff(r, 'speed') - 50;
      if (type === 3) { runs = B.filter(Boolean).length; N[2] = b; }
      else if (type === 2) {
        if (B[2]) runs++; if (B[1]) runs++;
        if (B[0]) { if (Math.random() < clamp(0.3 + sp(B[0]) * 0.004, 0.08, 0.7)) runs++; else N[2] = B[0]; }
        N[1] = b;
      } else {
        if (B[2]) runs++;
        if (B[1]) { if (Math.random() < clamp(0.55 + sp(B[1]) * 0.004, 0.25, 0.88)) runs++; else N[2] = B[1]; }
        if (B[0]) { const go3 = Math.random() < clamp(0.25 + sp(B[0]) * 0.004, 0.08, 0.5); if (go3 && !N[2]) N[2] = B[0]; else N[1] = B[0]; }
        N[0] = b;
      }
      g.bases = N; return runs;
    }
    function groundAdv(g) {
      const B = g.bases, N = [null, null, null]; let runs = 0;
      if (B[2]) { if ((B[0] && B[1]) || Math.random() < 0.45) runs++; else N[2] = B[2]; }
      if (B[1]) { if ((B[0] || Math.random() < 0.4) && !N[2]) N[2] = B[1]; else N[1] = B[1]; }
      if (B[0]) { if (!N[1]) N[1] = B[0]; else N[0] = B[0]; }
      g.bases = N; return runs;
    }
    function maybeSwitch(g, def) {
      const ft = g.teams[def];
      if (!ft.queue.length) return;
      const cur = ft.pitcher, nxt = ft.queue[0], ps = g.pst[cur.id];
      if (!ps || ps.pc <= 0) return;
      const now = pnow(cur, pcE(ps)), base = pscore(cur), nn = pnow(nxt, 0);
      const comfy = g.sc[def] - g.sc[1 - def] >= 5;
      let why = '';
      if (now <= base * (comfy ? 0.6 : 0.9) && nn > now) why = '疲労';
      else if (!comfy && (ps.ri >= 3 || ps.r >= 5) && nn >= now * 0.9) why = '打ち込まれ';
      if (why) {
        ft.queue.shift(); ft.pitcher = nxt;
        g.log.push({ k: 'hdr', t: `投手交代(${why})  ${cur.name} → ${nxt.name}` });
      }
    }

      sub: { t: '采配(交代)', b: '<ul><li>打席と打席の間に、控え選手へ交代できます。交代できるのは、ベンチ入りしていて、まだ出ていない選手です(故障中の選手は出られません)。交代で出た選手も、出場の成績と成長の対象です。替えられた選手は、試合に戻れません。</li><li><b>守っているとき</b>:「投手交代」と「守備交代」を使えます。</li><li><b>投手交代</b>:控えの投手に替えます。降板した投手は戻れません。自チームの投手は自動では交代しないので、ここから替えてください(「試合終了まで」を押したときだけ、自動で継投します)。</li><li><b>守備交代</b>:守備位置の順に並んだ一覧で、複数の選手をまとめて入れ替えられます。守備位置のボタンを押し、次に入れ替えたい選手のボタンを押します。いま出ている選手どうしなら、守備位置が入れ替わります(打順はそのままです)。控えの選手とも入れ替えられます(替わった選手は戻れません。控えの選手は、替わった選手の打順に入ります)。何回か入れ替えてから、「この内容で交代する」を押すと、まとめて反映されます。DHは、控えの選手とだけ入れ替えられます(いま出ている選手とは入れ替えられません)。お互いに、相手の位置を務められる場合だけ入れ替えられます(捕手の位置は、捕手どうしだけです)。</li><li><b>攻めているとき</b>:「代打」と「代走」を使えます。</li><li><b>代打</b>:次の打者を替えます。交代した選手は、そのまま同じ守備位置に入ります(捕手の位置には捕手、DHには野手か捕手)。</li><li><b>代走</b>:塁にいる走者を替えます(走者がいないときは押せません)。交代した選手は、そのまま同じ打順と守備位置に入り、その後の打席にも立ちます。走力の高い選手を選ぶのが基本です。</li><li>投手は投手しか、捕手は捕手しか替われません。野手の位置には、控えの野手が入ります。DHには、控えの野手か捕手が入ります。該当する控えがいない位置は、交代できません。画面の「控え:投手◯ 捕手◯ 野手◯」で、残りを確認できます。</li><li>投手交代・代打・代走の表では、最上段(黄色の行)に、いま出ている選手の能力が出ます。候補の選手と見比べて決められます。代打・代走のときは、「守備」の列で、そのあとに守れるかを確認できます。</li><li>「試合終了まで」を押すと、選手の交代はせずに、自動継投と、自動の盗塁・バントだけで、最後まで進みます。</li></ul>' },
      sign: { t: '盗塁・バント・全力投球', b: () => `<ul><li>試合中は、「次の打席」のほかに、攻撃中は「盗塁」「バント」、守備中は「全力投球」を使えます。使わなければ、普通に進みます(盗塁だけは、打席が進まず、盗塁の結果だけが出ます)。</li><li><b>守備・全力投球</b>:その打席だけ、投手の球威・制球・変化球が+${Math.round((SIGN.fullMul - 1) * 100)}%になります。同じレベルの打者に対して、OPSが約2〜3割下がります(全能力Bのチーム同士で、約.71から約.50)。代償として、その打席で${SIGN.fullPc}球ぶんの体力を消耗します。毎打席使うと、投手がすぐに疲れて崩れて不利になります。得点圏に走者がいる場面など、ここぞで使うのが基本です。</li><li><b>攻撃・盗塁</b>:塁上の走者に盗塁をさせます。押すと、盗塁の結果だけが出て、打席は進みません。結果を見たあとで、もう一度、盗塁・バントか「次の打席」を選べます。ボタンに、成功率が出ます。成功すると進塁し、失敗(盗塁死)すると走者がアウトになります。3つ目のアウトになったときは、チェンジです。</li><li><b>走者ごとの動き</b>:一塁のみ=一塁走者が二塁へ。二塁のみ=二塁走者が三塁へ。一二塁=重盗(2人とも走ります。失敗すると、先頭の二塁走者がアウトで、後ろの走者は二塁へ進みます)。一三塁=一塁走者だけが二塁へ(三塁走者は動きません)。三塁のみ・二三塁・満塁では、盗塁できません(本塁への盗塁はありません)。</li><li><b>成功率</b>:一塁→二塁は、64% +(走者の走力 − 相手捕手の守備)×1%です(35〜95%)。二塁→三塁と重盗は、その85%です(重盗は、先頭の二塁走者の三塁への盗塁で判定します)。選手の調子や疲労も反映されます。</li><li><b>損益分岐</b>:盗塁は、成功の得(約+0.2点)より、失敗の損(約−0.5点)のほうが大きく、成功率が約75%を超えないと得になりません(2アウトの一塁から二塁へは約76%、重盗は約63%)。同じレベルの選手どうしでは約64%なので、走力が相手捕手の守備より10ほど高い走者で使うのが目安です。</li><li><b>攻撃・バント</b>:走者がいて2アウト未満のときに使えます。三塁走者がいれば「スクイズ」、いなければ「送りバント」になります(走者なしと2アウトでは、押せません)。バントでは、打者のミートは使いません。</li><li><b>送りバント</b>:一塁・二塁の走者を進めます。成功すると、打者はアウトで、走者が1つ進塁します(犠打。打数には数えません)。成功率は、78% +(打者の走力 − 50)×0.1% −(相手の内野守備 − 50)×0.15%です。足の速い打者は、バントヒット(安打)になることもあります。失敗すると、小フライ(打者アウト)、封殺(先頭の走者がアウトで、打者は出塁)、併殺になります。</li><li><b>スクイズ</b>:三塁走者を生還させます。成功すると、1点が入り、打者はアウトで、ほかの走者は1つ進塁します。成功率は、70% +(三塁走者の走力 − 50)×0.2% −(相手の内野守備 − 50)×0.2%です。失敗すると、三塁走者が本塁でアウトになります。盗塁と同じで、このときは結果だけが出て、打席は始まりません。結果を見たあとで、もう一度、盗塁・バントか「次の打席」を選べます。</li><li><b>バントの使いどころ</b>:送りバントは、打つより得点の期待値が下がります(同じレベルのチーム同士で、無死一塁なら、弱い打者で約−0.06点、強い打者で約−0.22点)。ただし、弱い打者の無死一塁・二塁では、「1点以上取る確率」が少し上がります。同点や1点差の終盤の、下位打線で使うのが目安です。スクイズは、無死では打っても点が入りやすいので、ほぼ得になりません(損益分岐の成功率は約9割)。一死三塁が本命で、成功率が約7割を超えると、期待値でも得です(1点がほしい場面なら、5割台でも得です)。</li><li><b>成功率の色</b>:盗塁とスクイズの成功率は、損益分岐を超えると緑、大きく下回ると赤で表示されます。</li><li>自チームは、盗塁・バントのボタンを押したときと、「試合終了まで」を押したときだけ、盗塁とバントをします。相手チームは、条件に合うときに、自動で行います(送りバントは、同点か1点ビハインドで、無死で、打線の下位5人のとき。スクイズは、同点か1点ビハインドで、6回以降の一死のとき)。</li>${signNow()}</ul>` },
      camp: { t: '冬の特訓', b: () => `<ul><li>冬(12月の第3・第4週)の2週間は、特訓期間です。全員が対象で、全体練習と個人練習の伸びが約${TUNE.camp.mult}倍になります。</li><li>伸びしろが少ない選手も、1回に最低でも約${TUNE.camp.floor}は伸びます(伸びしろは超えません)。</li><li>疲労は、週に約+${TUNE.camp.fat - 4}です(通常は+2〜8)。2週間で約+${2 * (TUNE.camp.fat - 4)}たまります。疲労が${TUNE.camp.riskFrom}を超えるとケガの危険が出るので、開始前に疲労を抜いておくと、2週目まで安全に続けられます。</li><li>「休養」を選ぶと、その週の特訓は見送りです。個人練習を「休養」にした選手と、故障中の選手は、特訓に参加しません。</li><li>特訓の前の週と後の週に休養を入れても、通常の練習より伸びるように調整しています。</li></ul>` },
      district: { t: '秋季大会の地区予選', b: '<ul><li>秋季大会は、まず4校による地区予選(最大2試合)から始まります。</li><li>準決勝と決勝を勝ち抜いて、地区優勝した1校だけが、県大会(秋季大会)に進めます。</li><li>準決勝や決勝で負けると、秋季大会はそこで終わりです。県大会に出られないと、選抜の選考対象にもなりません。</li><li>県大会に進むときは、ベンチ入りメンバーを選び直せます。疲労は、試合の間に自動で回復します。</li></ul>' },
      senbatsu: { t: '選抜大会', b: '<ul><li>秋季大会(県大会)の成績で、選抜の出場可否が決まります。地区予選で敗退して県大会に出られなかった場合は、出場できません。優勝・準優勝は出場確実、ベスト4(準決勝で敗退)は約6割の確率で選ばれます。準決勝に進めなかった場合は、出場できません。</li><li>選考結果は、冬の練習の途中(1月末)に発表されます。</li><li>出場が決まると、3月に選抜大会(32校・5勝で優勝)が開かれます。その前にベンチ入りメンバーを選び直します。</li><li>選抜が終わると年度が終わり、新入生が入部します。</li></ul>' },
      menus: { t: '全体練習の効果', b: () => '<ul><li>休養以外の全体練習は、同じ週数続けたときの「勝つ力」の上がり方が、ほぼ同じになるよう調整されています(目安:全能力がBの選手のチームが4週間続けると、同格の相手との得失点差が、1試合あたり約+0.4点)。ただし、走り込みは疲労が重いぶん、効果を1割ほど高めにしてあります。伸びる能力が違うので、チームの弱いところに合わせて選びましょう。</li></ul>' + Object.keys(MENUS).map(k => `<h4>${MENUS[k].n}</h4><ul>${MENUS[k].e.map(x => `<li>${x}</li>`).join('')}</ul>`).join('') },
      rank: { t: 'チーム力の見方', b: '<ul><li>いま設定しているスタメン(「メンバー・ポジション」で決めた先発・守備位置・打順)での力です。</li><li>走=走力は、盗塁・内野安打・タッチアップ・単打での進塁などに効きます。盗塁は、走力が相手捕手の守備力より高いほど成功しやすくなります(失敗すると、走者がアウトです)。</li><li>打=ミート・パワー、投=投手3人の力(先発を重視)、守=守備(内野手は内野守備、外野手は外野守備、捕手は捕手の守備で評価。二塁・遊撃・中堅は影響大)、走=走力。投は捕手の守備力でも変わります。総合はこれらを合わせたものです。</li><li>試合では選手ごとに「調子」(絶不調〜絶好調)がランダムに付き、その試合の力が上下します。</li><li>ランクは数値で決まります:S=90以上 / A=80〜 / B=70〜 / C=60〜 / D=50〜 / E=40〜 / F=30〜 / G=30未満</li></ul>' },
      grow: { t: '成長と疲労のしくみ', b: '<ul><li>練習画面で選手の行をタップすると、能力の詳細と、個人練習の設定が開きます。</li><li>★は能力の「伸びしろ」(上限までの残り)です。多いほど1回の伸びが大きく、成長すると減ります。</li><li>能力ごとに隠れた伸びやすさがあり、毎回の伸びは乱数で上下します。</li><li>疲労バー:<b style="color:var(--fg)">緑</b>=40未満(通常) / <b style="color:var(--fy)">黄</b>=40〜69(伸び−2割・休養を検討) / <b style="color:var(--fo)">橙</b>=70以上(伸び−4割5分・ケガしやすい)。</li><li><b>故障</b>:練習中に疲労が高いと、ケガをすることがあります(週のランダムな出来事でも起こります)。ケガの期間は、1〜4練習分(ランダム)です。故障した選手は、全体練習も個人練習もできず、強制的に休養になります(疲労は回復します)。名前の横に、「故障 あと◯」と、残りの練習数が出ます。1週の練習で1練習分、試合は1試合で1練習分、回復が進みます(休養を選んでも、速くは治りません)。故障中の選手は、代わりに出られる控えがいれば、試合に出ません(スタメンから外れ、控えが代わります)。治ったあと、スタメンには自動では戻らないので、「メンバー・ポジション」で戻してください。</li><li>疲労の増減は選手ごとにばらつきます。</li><li>選手の名前の横に、マークが付きます。野手のスタメンは<b>★一塁・★二塁・★三塁・★遊撃・★左翼・★中堅・★右翼・★DH</b>、ベンチ入りの選手は<b>◆ベンチ</b>です。投手と捕手には、◆ベンチだけが付きます(DHに入った場合を除く)。</li><li>試合に出た選手は、出場経験と活躍(安打・本塁打・打点・盗塁・奪三振・守備機会など)でも成長します。控えは成長しません。甲子園(夏)と選抜の試合は、経験値が1.5倍になります。</li><li>週ごとに、ランダムな出来事(OBの指導・風邪・ケガなど)が起こることがあります。</li></ul>' },
      indiv: { t: '個人練習', b: '<ul><li>全体練習に加えて、選んだ能力が伸びます。</li><li>「休養」を選んだ選手は、その週は全体練習も休みます。能力は伸びず、疲労が大きく回復します(約38)。</li><li>故障中の選手は、自動で「休養」になり、設定は変えられません(治ったあとは、元の設定に戻ります)。</li><li>全体練習が「休養」の週は、全員が休みになります。</li></ul>' },
      order: { t: '打順', b: '<ul><li>打順の行を押し、次に入れ替えたい行を押すと、2人の打順が入れ替わります(もう一度押すと、選択を解除できます)。「打力順におまかせ」で、自動配置に戻せます。</li><li>DH制のため、投手は打席に立ちません。</li><li>ミ=ミート、パ=パワー、走=走力です。</li></ul>' },
      edit: { t: 'メンバー・ポジション', b: '<ul><li><b>入れ替え方</b>:選手の左端の「役割ボタン」を押し、次に入れ替えたい選手の役割ボタンを押すと、2人の役割が入れ替わります。入れ替えられない相手のボタンは薄くなります(もう一度押すと選択を解除できます)。</li><li><b>役割</b>:先発・2番手・3番手(投手)、捕・一・二・三・遊・左・中・右(守備位置)、DH、控(ベンチ入りの控え)、外(ベンチ外)です。「控」と「外」を入れ替えると、ベンチ入りのメンバーが変わります。</li><li>ベンチ入りは18名です(在籍が18名より少ないときは、全員です)。条件は、投手3名以上、捕手1名以上、野手7名以上、投手以外が9名以上(DHのため)です。ベンチ外の選手は試合に出られません。大会が始まってからは、ベンチ入りは変えられません。</li><li>投手は投手の枠だけ、捕手は捕手の枠だけを務められます。一塁〜右翼は野手のうち誰でも守れます。位置による適性の差はありませんが、一塁〜遊撃は内野守備、左翼〜右翼は外野守備の数値で判定されます(二塁・遊撃・中堅は重視されます)。DHは野手か捕手です。</li><li>先発・2番手・3番手:投手は、疲れて実力が元の9割以下になり、次の投手のほうが上なら交代します。1イニング3失点、または合計5失点で打ち込まれたときも交代します。ただし、5点以上リードしているときは続投します。エースを3番手にすれば温存できます。自動で継投するのは、試合中に「試合終了まで」を押したときだけです。</li><li><b>表の見方</b>:列名をタップすると、その能力で並べ替えられます(もう一度タップで逆順、疲労は少ない順が先)。各列で一番良い数値には下線が付き、色は能力のランク(S〜G)です。投手・捕手・野手のリストが縦に並び、同じ並べ替えが3つのリストに効きます。</li><li>総=総合、ミ=ミート、パ=パワー、走=走力、内=内野守備、外=外野守備、守=捕手の守備、球=球速(km/h)、制=制球、変=変化球、体=スタミナ、疲=疲労度、調=調子です。総合は、その選手の総合的な力です(投手は現在の疲労込みの投手力)。</li><li>大会の試合前は、各選手の調子(三角のアイコンで、上向き2つ=絶好調・上向き1つ=好調・横線=普通・下向き1つ=不調・下向き2つ=絶不調)も表示されます。調子は、その試合の能力を約±8%上下させます。試合前に決まり、試合が始まっても変わりません。</li><li>故障中の選手は、スタメンに入れられません(代わりに入れる控えがいない場合は、そのまま出場します)。名前の下に、「故3」のように、残りの練習数が出ます。</li><li>「おまかせ」で、能力の高い順に自動で組みます。故障中の選手は、できるだけ外します。</li></ul>' },
      between: { t: '試合間の回復', b: '<ul><li>試合の間に、全員の疲労が約22下がります(選手ごとにばらつきます)。</li><li>故障中の選手は、1試合が終わるたびに、1練習分ずつ回復が進みます(1試合=1練習分)。</li><li>準決勝・決勝は連戦のため、回復が約65%に減ります。</li></ul>' },
      tstats: { t: '高校通算成績', b: '<ul><li>入部してから現在までの、全試合(夏の地方大会・甲子園・秋季大会・選抜大会)の合計です。引退した選手は表示しません。</li><li>「盗/企」は、盗塁の成功数/企図数です。「犠」は、犠打(バントの成功)です。</li><li>失点率は、9回あたりの失点です(エラーによる失点も含みます)。</li></ul>' }
    };
    function signNow() {
      if (!G || G.over) return '';
      const ubx = G.teams.findIndex(t => t.us);
      if (G.half === ubx) return '';
      const pt = G.teams[ubx].pitcher, z = G.pst[pt.id] || { pc: 0 }, thr = (60 + pt.st.stam) * (1 - pt.fatigue / 260);
      return `<li><b>いまの投手(${esc(pt.name)})</b>:${z.pc}球 / 限界の目安${Math.round(thr)}球。全力投球で${SIGN.fullPc}球ぶん消耗します。</li>`;
    }
    let modalOpener = null;

    <div class="sub" style="margin-top:3px">${recruitStats(q)}</div></div></div>`;
      };
      $app.innerHTML = `<div class="hero"><h1 style="font-size:30px">スカウト</h1><p>${S.year}年目の春</p></div>
  ${h2i('スカウト候補(10名)', 'scout')}
  <div class="card">
  <div class="sub">評判による新入生の質:<b style="color:var(--ink)">${sc.bonus > 0 ? '+' + sc.bonus : '±0'}</b>(前年の成績で変わります)</div>
  <div style="margin-top:6px"><b>獲得 ${pk.length}/3</b></div>${msg ? `<div class="down" style="font-size:13px;font-weight:700;margin-top:4px">${esc(msg)}</div>` : ''}</div>
  <div class="card" style="padding:4px 12px">${list.map(row).join('')}</div>
  <button class="btn primary" ${pk.length === 3 ? '' : 'disabled'} data-act="scoutok">この3名で決定</button>`;
    }
    function rIntake() {
      const I = S.intake, list = I.ids.map(byId).filter(Boolean).sort((a, b) => roleRank[a.pos] - roleRank[b.pos]);
      const row = q => {
        const sc = I.scouted.includes(q.id);
        return `<div class="prow" style="cursor:default"><div class="row between"><div class="row"><span class="pos" data-p="${q.pos}">${q.pos}</span><b>${esc(q.name)}</b>${hnd(q)}${q.gem ? '<span class="badge gem">逸材</span>' : ''}</div>${sc ? '<span class="chk on">スカウト</span>' : ''}</div>
    <div class="sub" style="margin-top:3px">${recruitStats(q)}</div><div class="sub">${recruitStars(q)}</div></div>`;
      };
      $app.innerHTML = `<div class="hero"><h1 style="font-size:30px">新入生入部</h1><p>${S.year}年目の春</p></div>
  ${reportHtml()}
  ${h2p('新入生(1年)')}<div class="card" style="padding:4px 12px">${list.map(row).join('')}</div>
  <button class="btn primary" data-act="intakeok">練習を始める</button>`;
    }
    function render() {
      if (!S) { rTitle(); return; }
      if (G) { rGame(); return; }
      if (S.phase === 'train') rTrain(); else if (S.phase === 'bench' || S.phase === 'edit') rEdit(); else if (S.phase === 'tourney') rTourney(); else if (S.phase === 'yearend') rYearEnd(); else if (S.phase === 'scout') rScout(); else rIntake();
      window.scrollTo(0, 0);
    }

    function keepRender() { const y = window.scrollY; if (S.phase === 'train') rTrain(); else if (S.phase === 'bench' || S.phase === 'edit') rEdit(); else rTourney(); window.scrollTo(0, y); }
    function act(a, v, pid, slot, el) {
      switch (a) {
        case 'new': {
          const el = document.getElementById('sn'); if (el) ui.sn = el.value;
          const r = readSave();
          if (r && r.ok && !ui.confirmNew) { ui.confirmNew = true; rTitle(); break; } // セーブがあるときは、上書きの確認を挟む
          ui.confirmNew = false; ui.loadErr = false;
          const nm = (el && el.value.trim()) || '青葉台高校'; ui.sn = null; startNew(nm); break;
        }
        case 'cont': {
          ui.confirmNew = false; const r = readSave();
          if (!r || !r.ok) { ui.loadErr = true; rTitle(); break; }
          try { S = r.s; G = null; if (S.phase === 'edit') S.phase = S.editFrom || 'train'; UID = 1000 + Math.max(...S.players.map(p => p.id), 0); render(); }
          catch (e) { S = null; G = null; ui.loadErr = true; rTitle(); } // 検証をすり抜けた壊れ方でも、画面が止まらないようにする
          break;
        }
        case 'saveexit': {
          if (!S || G || S.phase !== 'train') break;
          ui.confirmReset = false; ui.open = null;
          if (!save()) break; // 保存に失敗したときは、警告を出してその場にとどまる(戻ると進行が失われるため)
          S = null; G = null; render(); break;
        }
        case 'delsave': clearSave(); ui.loadErr = false; ui.confirmNew = false; rTitle(); break;
        case 'newcancel': ui.confirmNew = false; rTitle(); break;
        case 'hint': { const b = document.getElementById('hint-' + v); if (b) { b.hidden = !b.hidden; if (el) el.setAttribute('aria-expanded', String(!b.hidden)); } break; }
        case 'menu': ui.menu = v; { const y = window.scrollY; rTrain(); window.scrollTo(0, y); } break;
        case 'ind': S.indiv = S.indiv || {}; S.indiv[pid] = v; save(); keepRender(); break;
        case 'open': { ui.open = ui.open === +v ? null : +v; keepRender(); break; }
        case 'train': doTraining(); break;
        case 'prep': prepGo(); break;
        case 'pa': stepPA(G); finalizeGame(); render(); break;
        case 'inn': stepInning(G); finalizeGame(); render(); break;
        case 'all': G.auto = true; stepAll(G); finalizeGame(); render(); break;
        case 'gend': { const res = gameResult(), cb = GC.onEnd; G.teams.forEach(t => t.players.forEach(p => { p.form = 0; })); active().forEach(q => { q.form = 0; }); if (S.t) S.t.formed = false; G = null; GC = null; cb(res); break; }
        case 'subp': case 'subph': case 'subpr': case 'subchg': if (G && !G.over && G.inn !== LOT_INN) openSub(a === 'subp' ? 'p' : a === 'subph' ? 'ph' : a === 'subpr' ? 'pr' : 'chg', el); break;
        case 'fullp': {
          if (G && !G.over && G.sign && G.inn !== LOT_INN) { const ub = G.teams.findIndex(t => t.us); if (G.half !== ub) { G.sign.d = true; stepPA(G); finalizeGame(); render(); } }
          break;
        }
        case 'steal': {
          if (G && !G.over && G.inn !== LOT_INN) { const ub = G.teams.findIndex(t => t.us); if (G.half === ub && sbPlan(G)) { doStealOnly(G); finalizeGame(); render(); } }
          break;
        }
        case 'bunt': {
          if (G && !G.over && G.sign && G.inn !== LOT_INN) { const ub = G.teams.findIndex(t => t.us); if (G.half === ub && buntPlan(G)) { doBuntSign(G); finalizeGame(); render(); } }
          break;
        }
        case 'subslot': if (ui.subm) { ui.subm.bo = +v; renderSub(); } break;
        case 'drb': {
          const D = ui.defm; if (!D) break; const id = +v;
          if (D.sel == null) { D.sel = id; D.msg = ''; }
          else if (D.sel === id) { D.sel = null; }
          else { const pl = defPlan(D, D.sel, id); if (pl.ok) { D.rows = pl.rows; D.bench = pl.bench; D.out = pl.out; D.sel = null; D.msg = ''; } else D.msg = pl.msg; }
          renderDef(); break;
        }
        case 'dsel0': if (ui.defm) { ui.defm.sel = null; renderDef(); } break;
        case 'dreset': if (ui.defm) { defStart(); renderDef(); } break;
        case 'dok': { if (!ui.defm || !G || G.over) break; const { ub } = subCtx(); applyDefense(G, ub, ui.defm.rows); closeHelp(); render(); break; }
        case 'subbase': if (ui.subm) { ui.subm.base = +v; ui.subm.bo = subCtx().t.order.indexOf(G.bases[+v]); renderSub(); } break;
        case 'subsort': if (ui.subm) { sortToggle(ui.subm.sort, v, subCols()); renderSub(); } break;
        case 'subpick': {
          if (!ui.subm || !G || G.over) break;
          const { ub } = subCtx(), real = byId(+v), sm = ui.subm;
          if (real) { if (sm.mode === 'p') doPitchChange(G, ub, real); else if (sm.mode === 'pr') doRunnerSub(G, ub, sm.base, real); else { doSub(G, ub, sm.bo, real, '代打'); } }
          closeHelp(); render(); break;
        }
        case 'rb': {
          ensureLineup(); const id = +v; ui.oswap = null;
          if (ui.swap == null) {
            if (roleOf(id) === 'out' && benchLocked()) ui.lmsg = '大会中は、ベンチ外の選手とは入れ替えできません';
            else ui.swap = id;
          } else if (ui.swap === id) { ui.swap = null; }
          else {
            const pl = planSwap(ui.swap, id);
            if (pl.ok) {
              const A = byId(ui.swap), B = byId(id), ra = roleOf(ui.swap), rb = roleOf(id);
              S.lineup = pl.L; S.bench = pl.bench; syncOrder();
              ui.linfo = `${A.name}(${roleFull(ra)})と${B.name}(${roleFull(rb)})を入れ替えました`; ui.swap = null; save();
            } else ui.lmsg = pl.msg;
          }
          keepRender(); break;
        }
        case 'esort': { const c = edAllCols().find(x => x.k === v); if (ui.esort.key === v) ui.esort.dir = -ui.esort.dir; else ui.esort = { key: v, dir: (v === 'role' || (c && c.inv)) ? 1 : -1 }; keepRender(); break; }
        case 'swapcancel': ui.swap = null; keepRender(); break;
        case 'eauto': { if (!benchLocked()) S.bench = autoBench(); S.lineup = {}; S.order = null; ensureLineup(); ui.swap = null; save(); keepRender(); break; }
        case 'ord': {
          ensureLineup(); const i = +v; ui.swap = null;
          if (ui.oswap == null) ui.oswap = i;
          else if (ui.oswap === i) ui.oswap = null;
          else { const x = ui.oswap, A = byId(S.order[x]), B = byId(S.order[i]);[S.order[x], S.order[i]] = [S.order[i], S.order[x]]; ui.linfo = `${A.name}(${x + 1}番)と${B.name}(${i + 1}番)の打順を入れ替えました`; ui.oswap = null; save(); }
          keepRender(); break;
        }
        case 'ordcancel': ui.oswap = null; keepRender(); break;
        case 'ordauto': { ensureLineup(); ui.oswap = null; S.order = autoOrder(hitterIds(S.lineup).map(byId)).map(q => q.id); save(); keepRender(); break; }
        case 'indauto': { active().forEach(q => { S.indiv[q.id] = bestKey(q); }); save(); keepRender(); break; }
        case 'benchok': benchOk(); break;
        case 'editopen': S.editFrom = S.phase; S.phase = 'edit'; ui.swap = null; ui.oswap = null; save(); render(); break;
        case 'editdone': S.phase = S.editFrom || 'train'; S.editFrom = null; ui.swap = null; ui.oswap = null; save(); render(); break;
        case 'ptab': ui.ptab = v; keepRender(); break;
        case 'reset': ui.confirmReset = true; rTrain(); break;
        case 'reset2': ui.confirmReset = false; clearSave(); S = null; G = null; render(); break;
        case 'newyear': newYear(); break;
        case 'scouttoggle': {
          const sc = S.scout, id = +v, i = sc.picked.indexOf(id), q = sc.cands.find(x => x.id === id);
          const cnt = pos => sc.picked.filter(x => sc.cands.find(c => c.id === x).pos === pos).length;
          if (i >= 0) sc.picked.splice(i, 1);
          else if (sc.picked.length >= 3) ui.msg = '獲得できるのは3名までです';
          else if (q.pos === '投' && cnt('投') >= 2) ui.msg = '投手は2名までしかスカウトできません';
          else if (q.pos === '捕' && cnt('捕') >= 1) ui.msg = '捕手は1名までしかスカウトできません';
          else sc.picked.push(id);
          save(); rScout(); break;
        }
        case 'scoutok': scoutOk(); break;
        case 'intakeok': intakeOk(); break;
      }
    }
    document.addEventListener('click', e => {
      if (e.target.id === 'modal') { closeHelp(); return; }
      const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'SUMMARY') return;
      if (el.dataset.act === 'help') { openHelp(el.dataset.v, el); return; }
      if (el.dataset.act === 'closeModal') { closeHelp(); return; }
      act(el.dataset.act, el.dataset.v, el.dataset.p ? +el.dataset.p : undefined, el.dataset.s, el);
    });
    document.addEventListener('change', e => { const el = e.target.closest('select[data-act]'); if (el) act(el.dataset.act, el.value, +el.dataset.p, el.dataset.s); });
    document.addEventListener('keydown', e => {
      const mo = document.getElementById('modal');
      if (mo && !mo.hidden) {
        if (e.key === 'Escape') { closeHelp(); return; }
        if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && (e.target.dataset.act === 'subpick')) { e.preventDefault(); act(e.target.dataset.act, e.target.dataset.v); return; }
        if (e.key === 'Tab') { const bs = [...mo.querySelectorAll('button,[data-act="pick"],[data-act="subpick"]')]; if (bs.length) { const f = bs[0], l = bs[bs.length - 1]; if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); } else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); } } }
        return;
      } if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && (e.target.dataset.act === 'open' || e.target.dataset.act === 'scouttoggle')) { e.preventDefault(); act(e.target.dataset.act, e.target.dataset.v); }
    });
    render();
  </script>
</body>
