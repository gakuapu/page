  <meta name="description" content="
    無料・ダウンロード不要のプロ野球GMシミュレーションゲーム。球団のGMとなって選手編成や育成、契約更改、ドラフト、FA補強などを行い、リーグ優勝と日本一を目指そう！ブラウザですぐに遊べます。モバイルにも対応

  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"

  <style>
    :root {
      box-sizing: border-box;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      /* 生成りの地・墨の文字・紺を主役に、縫い目の赤を差し色にする */
      --bg: #f5f1e6;
      --card: #fffdf8;
      --ink: #1f2433;
      --sub: #656a77;
      --line: #e8e2d1;
      --edge: #d9d2bd;
      --navy: #1e3a6d;
      --navy-d: #152b54;
      --navy-t: #e7ecf6;
      --red: #c4372c;
      --red-t: #fbece9;
      --amber: #d99f1a;
      --bad: #c4372c;
      --good: #2f8a4e;
      --fg: #4fae5f;
      --fy: #e3b81c;
      --fo: #e8782a;
      --shadow: 0 1px 2px rgba(48, 40, 16, .06), 0 4px 14px rgba(48, 40, 16, .04);
      --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      --disp: var(--font);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 var(--font);
      -webkit-text-size-adjust: 100%
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 44px
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.3
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 10px;
      padding: 1px 0 1px 10px;
      border-left: 4px solid var(--navy);
      font-family: var(--disp);
      font-weight: 900;
      font-size: 16px;
      color: var(--ink)
    }

    h2 .ht {
      flex: 1;
      min-width: 0
    }

    .title {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 21px;
      color: var(--ink)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow)
    }

    .sub {
      color: var(--sub);
      font-size: 13px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .between {
      justify-content: space-between
    }

    .wrap {
      flex-wrap: wrap
    }

    .grow {
      flex: 1
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    /* ボタン:通常はフラット。主要操作(primary)だけを紺で塗る */
    .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
      text-align: center;
      transition: background .12s, border-color .12s
    }

    a.btn {
      text-decoration: none
    }

    .btn:active {
      background: var(--navy-t);
      border-color: var(--navy)
    }

    .btn.primary {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 2px 0 var(--navy-d)
    }

    .btn.primary:active {
      background: var(--navy-d);
      transform: translateY(1px);
      box-shadow: none
    }

    .btn.amber {
      background: var(--red-t);
      border-color: #e2b3ad;
      color: #9b2a21
    }

    .btn.amber:active {
      background: #f6d9d5;
      border-color: var(--red)
    }

    .btn.sm {
      min-height: 0;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
      border-radius: 8px

    .btn:focus-visible,
    select:focus-visible,
    input:focus-visible,

    }

    .seg button+button {

    }

    .seg button.on {

      color: #fff
    }

    input[type=text] {

      width: 100%;
      padding: 10px;

      border: 1px solid var(--edge);

    select.rest {

      border-color: #8cc79b;
      color: #1f6b3a;

    }

    /* タイトル画面・節目の画面 */
    .hero {
      position: relative;
      background: var(--card);
      border: 1px solid var(--edge);

      padding: 28px 16px 22px;
      text-align: center;
      margin: 6px 0 16px;

    }

      font-weight: 900;
      font-size: 42px;

    .report {
      border: 1px solid #e6d9a3;

      color: #4a3d10;

    table.bx {

      border-collapse: collapse;
      font-size: 13px
    }

      border-bottom: 1px solid var(--line);

    }

    table.bx th {

      font-weight: 700
    }

    table.bx th:first-child,
    table.bx td:first-child {

    }

    details {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: var(--shadow);

    details summary {

    }

    details>.card {
      border: 0;
      box-shadow: none;
      padding: 6px 0 0;
      margin: 0;

    .info {
      flex: none;
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--navy);

    #savewarn {

<body>
  <div id="app"></div>
  <div id="modal" hidden></div>
  <script>
    // ==ENGINE_START==
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const rnd = (a, b) => a + Math.random() * (b - a);
    const ri = (a, b) => Math.floor(rnd(a, b + 1));
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
    const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    function wpick(items, w) { let r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }

        const fa = p.decl; letGo(t, p); repairL(t); ui.msg = fa ? p.name + 'を慰留しませんでした' : p.name + 'を自由契約にしました'; ui.sel = null; save(); render();
      }
      else if (a === 'dstart') { const m = draftMax(t); st.draft = { rd: 0, n: m < 5 ? 0 : 5, pre: m < 5, c: genDraft(), picks: [] }; ui.dsel = ui.dcut = ui.dcutOk = null; ui.dopen = false; ui.dview = 'draft'; ui.msg = ''; fixUID(); save(); render(); }
      else if (a === 'dsel') { ui.dsel = ui.dsel === +v ? null : +v; render(); }
      else if (a === 'dpick') { const d = st.draft, q = d && ui.dsel && d.c[d.rd].find(x => x.id === ui.dsel); if (!q) return; if (t.players.length + d.picks.length >= CAPN || st.money - r1(d.picks.reduce((a, x, i) => a + pickCost(i), 0)) < pickCost(d.picks.length) - 1e-9) { ui.msg = '登録の空き枠か資金が足りないため、指名できません'; render(); return; } d.picks.push(q); d.rd++; ui.dsel = null; save(); render(); }
      else if (a === 'dgo') { const d = st.draft, m = draftMax(t); if (!d || m <= 0) return; d.pre = false; d.n = m; ui.msg = ''; ui.dsel = null; save(); render(); }
      else if (a === 'dnone') { const d = st.draft; if (!d) return; d.pre = false; d.n = 0; d.rd = 0; ui.msg = ''; save(); render(); }
      else if (a === 'dfold') { ui.dopen = !ui.dopen; render(); }
      else if (a === 'dcutsel') { ui.dcut = ui.dcut === +v ? null : +v; ui.dcutOk = null; render(); }
      else if (a === 'dcut') { if (ui.dcutOk !== ui.dcut) ui.dcutOk = ui.dcut; else { const p = byId(t, ui.dcut); if (!p) return; const c = unpaid(p), e = releaseP(t, p); if (e) ui.msg = e; else { ui.msg = p.name + 'を放出しました' + (c > 0 ? '(残りの契約の年俸 ' + c.toFixed(1) + '億円を支払い)' : ''); ui.dcut = ui.dcutOk = null; save(); } } render(); } // 参加前に、二軍の選手を放出して枠を作れる(契約中なら、残りの年俸を支払う)
      else if (a === 'djoin') { st.draft.picks.forEach((q, i) => { q.dr = i + 1; q.drY = st.season; q.sal = DRAFT_SAL; q.yrs = 1; q.nw = true; t.players.push(q); }); const fee = r1(st.draft.picks.reduce((a, q, i) => a + PICK_FEE[i], 0)), sal = r1(st.draft.picks.length * DRAFT_SAL), rk = r1(fee + sal); st.money = r1(st.money - rk); if (st.draft.picks.length) st.info = (st.info ? st.info + ' / ' : '') + '新人' + st.draft.picks.length + '人の契約金 ' + fee + '億円+年俸1年分 ' + sal + '億円を支払いました'; st.draft = null; st.drafted = true; st.mk = fillMk(aiOff()); st.stage = 'fa'; ui.sel = null; ui.tab = t.players.length >= CAPN ? 'roster' : 'contract'; ui.msg = ''; save(); render(); } // ドラフトのあとにFA市場が開く(満員なら、先に編成画面で放出する)
      else if (a === 'auto') { const pit = ui.pos !== 'H', np = autoLg(t, pit); ui.sel = ui.rel = null; ui.msg = (pit ? '投手' : '野手') + 'の編成をおまかせにしました' + (np ? `(固定${np}人はそのまま)` : ''); save(); render(); }
      else if (a === 'fpick') { const was = ui.sel; ui.sel = ui.sel === +v ? null : +v; ui.msg = ''; if (ui.sel != null && was !== ui.sel) { anchor = null; jumpTo = 'pdetail'; } render(); }
      else if (a === 'pin') { const p = byId(t, ui.sel); if (!p || !roleOf(t, p.id)) return; p.pin = !p.pin; ui.msg = p.name + (p.pin ? 'のポジションを固定しました' : 'の固定を解除しました'); save(); render(); }
      else if (a === 'pick') {
        const p = byId(t, +v); ui.rel = null; ui.msg = '';
        if (ui.sel == null) ui.sel = p.id;
        else if (ui.sel === p.id) ui.sel = null;
        else {
          const q = byId(t, ui.sel), rq = roleOf(t, q.id), rp = roleOf(t, p.id);
          if ((rq && q.pin) || (rp && p.pin)) ui.msg = ((rq && q.pin) ? q : p).name + 'はポジションを固定中です。固定を解除してください';
          else if (!rq && !rp) ui.msg = '二軍どうしは入れ替えできません';
          else if ((rp && !slotOkManual(rp, q)) || (rq && !slotOkManual(rq, p))) ui.msg = 'そのポジションには入れません';
          else if ((() => { const nl = { ...t.L }; if (rq) nl[rq] = p.id; if (rp) nl[rp] = q.id; const n = fgnN(t, nl); return n > FMAX && n > fgnN(t, t.L); })()) ui.msg = '一軍に登録できる外国人は4人までです';
          else { if (rq) t.L[rq] = p.id; if (rp) t.L[rp] = q.id; ui.msg = q.name + 'と' + p.name + 'を入れ替えました';[p, q].forEach(x => { if (!roleOf(t, x.id)) x.pin = false; }); ui.sel = null; save(); }
        }
        render();
      }
      else if (a === 'rel') { if (ui.rel !== ui.sel) ui.rel = ui.sel; else { const p = byId(t, ui.sel); if (!p) return; const c = unpaid(p), e = releaseP(t, p); if (e) ui.msg = e; else { ui.msg = p.name + 'を放出しました' + (c > 0 ? '(残りの契約の年俸 ' + c.toFixed(1) + '億円を支払い)' : ''); ui.sel = ui.rel = null; save(); } } render(); }
      else if (a === 'sign') {
        const mkt = st.mi >= MN.length && st.stage === 'fa', p = (mkt ? st.mk : st.fa).find(x => x.id === ui.sel); if (!p) return; const y = ui.yrs || 2, f = mkt ? mfee(p, y) : fee(p), c = mkt ? comp(p) : 0, ns = mkt ? dem(p, y) : p.sal;
        if (!mkt && st.mi > FA_END) ui.msg = '外国人選手の獲得は7月末で締め切りました';
        else if (mkt && p.mk === 'FA' && (st.faN || 0) >= 2) ui.msg = 'FA宣言選手の獲得は、1シーズンに2名までです'
        else if (st.money < f + c + ns) ui.msg = '資金が足りません(必要:' + (f ? '契約金' + f + '億+' : '') + (c ? '補償金' + c + '億+' : '') + '年俸1年分' + ns.toFixed(1) + '億)';
        else if (t.players.length >= CAPN) ui.msg = '登録が満員です。編成タブで二軍の選手を放出してください';
        else { st.money = Math.round((st.money - f - c - ns) * 10) / 10; if (mkt && p.mk === 'FA') st.faN = (st.faN || 0) + 1; if (mkt) { p.sal = dem(p, y); p.yrs = y; p.nw = true; p.mk = null; p.decl = false; p.ol = false; st.mk = st.mk.filter(x => x !== p); } else st.fa = st.fa.filter(x => x !== p); t.players.push(p); ui.msg = p.name + 'を獲得しました(二軍・年俸' + p.sal.toFixed(1) + '億' + (c ? '・' + p.from + 'へ補償金' + c + '億' : '') + ')'; ui.sel = null; save(); }
        render();
      }
      else if (a === 'reset') { save(); st = null; pre = null; ui.pick = false; ui.confirmNew = false; render(); }
      else if (a === 'new') { ui.confirmNew = true; render(); }
      else if (a === 'newcancel') { ui.confirmNew = false; render(); }
      else if (a === 'newok') { ui.confirmNew = false; ui.pick = true; render(); }
      else if (a === 'toTop') { ui.pick = false; render(); }
    }
    document.addEventListener('click', e => { if (e.target.id === 'modal') { closeModal(); return; } const el = e.target.closest('[data-act]'); if (el) { setAnchor(el); act(el.dataset.act, el.dataset.v, el); } });
    document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.act === 'yrs') { ui.yrs = +el.value; render(); return; } if (!(el.dataset && el.dataset.act === 'tr' && st)) return; const p = byId(mine(), +el.dataset.p); if (p) { p.tr = el.value; save(); render(); } });
    document.addEventListener('keydown', e => { const mo = document.getElementById('modal'); if (mo && !mo.hidden) { if (e.key === 'Escape') { closeModal(); return; } if (e.key === 'Tab') { e.preventDefault(); const b = mo.querySelector('button'); if (b) b.focus(); return; } } if ((e.key === 'Enter' || e.key === ' ') && e.target.tagName !== 'SELECT' && e.target.dataset && e.target.dataset.act) { e.preventDefault(); setAnchor(e.target); act(e.target.dataset.act, e.target.dataset.v, e.target); } });
    render();

  </script>
