<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XKL20YHCTB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XKL20YHCTB');

  <meta charset="utf-8">
  <meta name="theme-color" content="#f5f1e6">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>野球シム｜無料で遊べるブラウザ野球シミュレーションゲーム</title>
  <meta name="description" content="
    無料・ダウンロード不要で遊べる野球シミュレーションゲーム「野球シム」。高校野球部を運営する「野球部シム」と、プロ野球チームを運営する「球団シム」の2つのゲームをブラウザで楽しめます。モバイルにも対応
    ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      /* 生成りの地・墨の文字・紺を主役に、縫い目の赤を差し色にする(野球部シム・球団シムと同じ配色) */
      --bg: #f5f1e6;
      --card: #fffdf8;
      --ink: #1f2433;
      --sub: #656a77;
      --line: #e8e2d1;
      --edge: #d9d2bd;
      --navy: #1e3a6d;
      --navy-d: #152b54;
      --navy-t: #e7ecf6;
      --red: #c4372c;
      --shadow: 0 1px 2px rgba(48, 40, 16, .06), 0 4px 14px rgba(48, 40, 16, .04);
      --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      --disp: var(--font);
    }

    .back {
      display: inline-block;
      padding: 6px 2px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none
    }

    .back:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: 2px
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 var(--font);
      -webkit-text-size-adjust: 100%
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 44px
    }

    h1,
    h3 {
      margin: 0;
      line-height: 1.3
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    .sub {
      color: var(--sub);
      font-size: 13px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .between {
      justify-content: space-between
    }

    .hero {
      position: relative;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 28px 16px 22px;
      text-align: center;
      margin: 6px 0 16px;
      box-shadow: var(--shadow)
    }

    .hero h1 {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 42px;
      letter-spacing: .1em;
      color: var(--navy)
    }

    .hero p {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--sub);
      letter-spacing: .14em
    }

    .hero svg {
      display: block;
      margin: 0 auto 8px;
      animation: bob 2.4s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-5px) rotate(8deg)
      }
    }

    .tg {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--edge);
      border-radius: 999px;
      padding: 0 8px;
      line-height: 1.6;
      white-space: nowrap;
      background: #f4efe0;
      color: var(--sub)
    }

    .tg.b {
      background: var(--navy-t);
      border-color: #c4d0e8;
      color: var(--navy)
    }

    .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
      text-align: center;
      transition: background .12s, border-color .12s
    }

    .btn:active {
      background: var(--navy-t);
      border-color: var(--navy)
    }

    .btn.sm {
      min-height: 0;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
      border-radius: 8px
    }

    .btn:focus-visible,
    .info:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: 2px
    }

    /* ゲームを選ぶカード:上のリンクで遊ぶ、下のボタンで遊び方を見る */
    .game {
      margin-bottom: 12px;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .game .gl {
      display: block;
      padding: 16px 16px 10px;
      color: var(--ink);
      text-decoration: none;
      transition: background .12s
    }

    .game .gl:active {
      background: var(--navy-t)
    }

    .game .gl:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: -2px
    }

    .game .gt {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .game .gn {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 21px;
      color: var(--navy)
    }

    .game .go {
      margin-left: auto;
      font-family: var(--disp);
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      color: var(--navy)
    }

    .game .sub {
      margin-top: 2px
    }

    .game .gh {
      padding: 0 16px 14px
    }

    .info {
      flex: none;
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--edge);
      background: var(--card);
      color: var(--navy);
      font-weight: 900;
      font-size: 13px;
      line-height: 1;
      padding: 0
    }

    .info::after {
      content: "";
      position: absolute;
      inset: -8px
    }

    .info:active {
      background: var(--navy-t);
      border-color: var(--navy)
    }

    #modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(31, 36, 51, .45);
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    #modal[hidden] {
      display: none
    }

    .sheet {
      background: var(--card);
      color: var(--ink);
      width: 100%;
      max-width: 560px;
      max-height: 82%;
      overflow: auto;
      border: 0;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 40px rgba(20, 25, 40, .25);
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px))
    }

    .sheet h3 {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 17px
    }

    .sheet h4 {
      margin: 14px 0 2px;
      font-size: 14px;
      color: var(--navy)
    }

    .sheet ul {
      margin: 4px 0;
      padding-left: 1.2em;
      font-size: 14px
    }

    .sheet li {
      padding: 3px 0
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <a class="back" href="index_game.html">‹ ゲーム一覧へ</a>
    <div class="hero">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="28" fill="#fff" stroke="#1f2433" stroke-width="3" />
        <path d="M14 14 C26 22 26 42 14 50 M50 14 C38 22 38 42 50 50" fill="none" stroke="#c4372c" stroke-width="3"
          stroke-linecap="round" />
      </svg>
      <h1>野球シム</h1>
      <p>遊ぶゲームを選ぶ</p>
    </div>
    <div class="game">
      <a class="gl" href="yakyubu-sim.html">
        <div class="gt"><span class="gn">野球部シム</span><span class="tg b" id="save-yakyubu" hidden>セーブあり</span><span
            class="go" aria-hidden="true">›</span></div>
        <div class="sub">高校野球育成シミュレーション</div>
      </a>
      <div class="gh"><button class="btn sm" data-howto="yakyubu">? 遊び方</button></div>
    </div>
    <div class="game">
      <a class="gl" href="kyudan-sim.html">
        <div class="gt"><span class="gn">球団シム</span><span class="tg b" id="save-kyudan" hidden>セーブあり</span><span
            class="go" aria-hidden="true">›</span></div>
        <div class="sub">プロ野球GMシミュレーション</div>
      </a>
      <div class="gh"><button class="btn sm" data-howto="kyudan">? 遊び方</button></div>
    </div>
  </div>
  <div id="modal" hidden></div>
  <!-- 遊び方の本文:各ゲームのトップの「? 遊び方」と同じ内容 -->
  <template id="howto-yakyubu">
    <ul>
      <li>最初は、2年生と1年生の新チームで、4月から始まります。毎週の練習で選手を育て、7月の地方大会(4勝)、勝ち抜けば甲子園(5勝)を目指します。</li>
      <li>夏が終わると3年生が引退します(最初の年は、3年生がいません)。1・2年生の新チームで、秋季大会に挑みます(まず地区予選で優勝すると、県大会に進めて、4勝で優勝です)。</li>
      <li>秋の成績が良ければ、冬の練習のあとに春の選抜大会(5勝)に出場できます。</li>
      <li>春になると学年が進み、スカウトで新入生を迎えます。2年目の春から、3年生が加わります。そこから次の年の夏へ、サイクルが続きます。</li>
      <li>選手は各学年10名(投手2・捕手1・野手7)。毎週「全体練習」を選び、選手ごとに「個人練習」(伸ばす能力)を設定します。</li>
      <li>
        大会の前にベンチ入り18名を選び、試合前に先発メンバーと打順を決めます。試合は「次の打席」で1打席ずつ進みます。攻撃では盗塁・バント・代打・代走、守備では全力投球・投手交代・守備交代で、采配できます。「イニング終了まで」「試合終了まで」で、自動で進めることもできます。5回・6回は10点差、7回以降は7点差がつくと、コールドゲームで試合が終わります(甲子園の夏と選抜は、コールドなし)。
      </li>
      <li>疲労が高いと伸びが落ち、ケガもしやすくなります。休養も使いましょう。ケガをすると、1〜4練習分(試合は1試合で1練習分)の間、練習も試合もできなくなります。冬の12月後半には、伸びが大きい2週間の特訓があります。
      </li>
      <li>選手には右・左があります(投手は投げ方、野手は打つ側)。右打者×右投手が基準です。左右が逆の組み合わせは打者がやや有利、左打者×左投手は投手がやや有利になります。</li>
      <li>
        <b>データの保存</b>:進行は、操作のたびに、ブラウザの中へ自動で保存されます(練習、メンバーの変更、試合の開始と終了など)。次に開いたときは、タイトル画面の「続きから」で再開できます。保存先は、この端末のこのブラウザの中だけです。別の端末やブラウザには引き継げず、ブラウザのデータ(サイトデータ・履歴)を消したり、プライベートブラウズで遊んだりすると、消えることがあります。試合の途中で閉じたときは、その試合が始まる前の状態から再開します(試合の途中経過は保存されません)。「最初からやり直す」は、確認のあとに保存データを消して、最初から始めます(元には戻せません)。
      </li>
    </ul>
  </template>
  <template id="howto-kyudan">
    <h4>ゲームの目的</h4>
    <ul>
      <li>6球団(都道府県)のリーグで、GMとして球団を強くして、リーグ優勝と日本一を目指します。</li>
      <li>最初に球団の都道府県を選ぶと、対戦相手の5球団が決まります。</li>
      <li>自球団は、リーグ最弱の戦力と、少ない資金(8億円)から始まります。</li>
    </ul>
    <h4>1シーズンの流れ</h4>
    <ul>
      <li>1シーズンは3〜10月の8か月です。</li>
      <li>「○月を進める」を押すと、練習と18試合が自動で進みます。</li>
      <li>試合は自動で行われ、操作できるのは、編成と契約です。</li>
      <li>月が進むごとに、前月の出来事(勝敗・順位・怪我・成長など)が出ます。</li>
      <li>シーズンが終わると、上位3チームがポストシーズン(プレーオフ、日本シリーズ)に進みます。</li>
      <li>自チームが出場しない年や、敗退したあとは、結果まで自動で進みます。</li>
    </ul>
    <h4>編成</h4>
    <ul>
      <li>一軍は、先発6・中継ぎ7・抑え1・捕手3・野手14です。</li>
      <li>二軍の選手と入れ替えたり、「編成をおまかせ」で自動で組んだりできます。</li>
      <li>「ポジションを固定」した選手は、おまかせでも動かしません。</li>
      <li>疲労が高い選手は、練習メニューの「休養」で回復させます。</li>
      <li>選手ごとに、毎月の練習メニュー(伸ばす能力)を設定できます。</li>
    </ul>
    <h4>成長と年齢</h4>
    <ul>
      <li>能力は、練習と試合出場で伸び、29歳前後のピークを過ぎると落ちます。</li>
      <li>二軍の若手が、まれに急成長することがあります。</li>
    </ul>
    <h4>オフの流れ</h4>
    <ul>
      <li>シーズンが終わると、「契約更改」「ドラフト会議」「来季へ進む」の順に進みます。</li>
      <li>契約更改では、契約が切れる選手を、更改するか自由契約にします。</li>
      <li>FA宣言した選手は、更改するか、慰留しないかを選びます。</li>
      <li>ドラフトでは、最大5人を指名できます。</li>
      <li>ドラフトのあとは、FA・自由契約の市場で選手を獲得できます。</li>
    </ul>
    <h4>お金</h4>
    <ul>
      <li>収入は、シーズンの終わりに、勝利数と順位で決まる1年分が入ります。</li>
      <li>ポストシーズンの試合ごとにも収入があります。</li>
      <li>年俸は、契約・更改のときに、1年分を支払います。</li>
      <li>登録は最大70人です。</li>
      <li>資金が足りないと、更改も補強もドラフトの指名もできません。</li>
    </ul>
    <h4>補強</h4>
    <ul>
      <li>シーズン中(3〜7月)に獲得できるのは、外国人選手だけです。</li>
      <li>候補は毎月入れ替わり、一軍に登録できる外国人は4人までです。</li>
      <li>オフには、FA・自由契約の市場で獲得できます(FA宣言した選手は、1シーズンに2人までです)。</li>
    </ul>
    <h4>成績タブ</h4>
    <ul>
      <li>順位、チームスタッツ(自球団・リーグ平均・順位)、個人成績が見られます。</li>
      <li>順位が低い項目が、強化するポイントです。</li>
    </ul>
    <h4>データの保存</h4>
    <ul>
      <li>進行は、操作のたびに、ブラウザの中へ自動で保存されます。</li>
      <li>右上の「セーブして終わる」で、トップへ戻れます。</li>
      <li>次に開いたときは、トップの「続きから」で再開できます。</li>
      <li>保存先は、この端末のこのブラウザの中だけです。</li>
      <li>別の端末やブラウザには引き継げず、ブラウザのデータ(サイトデータ・履歴)を消したり、プライベートブラウズで遊んだりすると、消えることがあります。</li>
      <li>「新規ゲーム」は、確認のあとに保存データを上書きして、最初から始めます(元には戻せません)。</li>
    </ul>
  </template>
  <script>
    // 各ゲームのセーブがあるときは、「セーブあり」と出す(各ゲームと同じブラウザの保存先を見るだけで、何も書き込まない)
    [['save-yakyubu', 'yakyubu_sim_v1'], ['save-kyudan', 'proGM5']].forEach(function (p) {
      try { if (localStorage.getItem(p[1]) !== null) document.getElementById(p[0]).hidden = false; } catch (e) { }
    });
    // 遊び方のシート(ゲームのトップと同じ形)
    var TITLES = { yakyubu: '野球部シムの遊び方', kyudan: '球団シムの遊び方' }, modal = document.getElementById('modal'), opener = null;
    function openHowto(key, btn) {
      var t = document.getElementById('howto-' + key); if (!t) return;
      modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row between"><h3 id="mt">' + TITLES[key] + '</h3><button class="info" data-close aria-label="閉じる">✕</button></div><div>' + t.innerHTML + '</div><button class="btn" data-close style="margin-top:14px">閉じる</button></div>';
      modal.hidden = false; document.body.style.overflow = 'hidden'; opener = btn || null;
      var c = modal.querySelector('button'); if (c) c.focus();
    }
    function closeHowto() {
      modal.hidden = true; modal.innerHTML = ''; document.body.style.overflow = '';
      if (opener) opener.focus(); opener = null;
    }
    document.addEventListener('click', function (e) {
      if (e.target === modal) { closeHowto(); return; }
      var h = e.target.closest('[data-howto]'); if (h) { openHowto(h.getAttribute('data-howto'), h); return; }
      if (e.target.closest('[data-close]')) closeHowto();
    });
    document.addEventListener('keydown', function (e) {
      if (modal.hidden) return;
      if (e.key === 'Escape') { closeHowto(); return; }
      if (e.key === 'Tab') { e.preventDefault(); var b = modal.querySelector('button'); if (b) b.focus(); }
    });
  </script>
</body>

</html>
