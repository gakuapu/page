            <h2>終了しますか？</h2>
            <p>進行状況は失われ、トップに戻ります。</p>
            <div class="row"><button id="cfn">続ける</button><button id="cfy">終了する</button></div>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id);
        const cv = $('c'), ctx = cv.getContext('2d');
        if (!ctx.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath() }; // 古いSafari(16未満)対応
        const COLORS = ['#e4574d', '#3f7fd6', '#f2b632', '#3fa774'];
        const ROAD_PACK = 5, ROAD_PACK_COST = 20, MAX_BUYS = 2;
        const roadCost = () => ROAD_PACK_COST * (1 + S.buys); // 2回目は2倍
        const WIDE_COST = 6; // 道路1マスの拡幅コスト
        const HOUSES_PER_OFFICE = 5; // 1オフィスあたりの家の数
        const UPC = [8, 16, 28]; // オフィス強化に必要なポイント(Lv1→2, 2→3, 3→4)
        const tu = d => 1 / (1 + .6 * (d.lv - 1)); // オフィスでの降車時間
        const MAXP = 7, NORMAL_GOAL = 3000, DEV_STOCK = 150, MAX_STOCK = 150, CLEAR_HOLD = 20, DEV_HOUSES = 40, DEV_WARM = 30; // パズルモード：道路の数(補充なし) / 開始時の家の数(増えない。オフィスは家5軒に1軒の比率で建つ) / 渋滞ゼロのカウント(秒) / カウントを始められるまでの待ち時間(秒)
        const capStock = n => diff === 'dev' ? Math.min(n, MAX_STOCK) : n;
        // パズルモードはポイントなし（拡幅・消す・オフィス強化・オフィス建設はすべて無料）
        const canPay = c => diff === 'dev' || S.pts >= c;
        const pay = c => { if (!canPay(c)) return false; if (diff !== 'dev') S.pts -= c; return true };
        let office = -1, lastOf = '', tunnel = false, tun1 = -1, W, H, dpr, cell, ox, oy, cols = 0, rows = 0, bc = 0, br = 0, T = {}, S = null, running = false, started = false, eraser = false, wide = false, bridge = false, hover = -1, diff = 'normal';
        const pinBase = () => diff === 'dev' ? 3 : Math.max(3, 9 - S.t / 50); // 点が増える間隔(秒)。パズルモードは最初から3秒

        function readTheme() { const s = getComputedStyle(document.documentElement); for (const k of ['ground', 'grid', 'water', 'road', 'bridge']) T[k] = s.getPropertyValue('--' + k).trim() }
        function resize() {
            dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
            cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
            const top = $('hud').getBoundingClientRect().height + 4, bot = (parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0) + 8;
            const aw = W - 8, ah = H - top - bot;
            if (!bc) { bc = 12; br = 16 } // 盤面は画面サイズによらず固定: ノーマル横12×縦16、パズルは+1で横13×縦17
            cols = bc + (diff === 'dev' ? 1 : 0); rows = br + (diff === 'dev' ? 1 : 0); // パズルモードは縦横+1マス
            cell = Math.min(aw / cols, ah / rows); ox = (W - cell * cols) / 2; oy = top + (ah - cell * rows) / 2; readTheme();
        }
        function nb(i) { const x = i % cols, y = (i / cols) | 0, r = []; if (x > 0) r.push(i - 1); if (x < cols - 1) r.push(i + 1); if (y > 0) r.push(i - cols); if (y < rows - 1) r.push(i + cols); return r }
        const ek = (a, b) => a < b ? a + '_' + b : b + '_' + a;
        const P = i => [ox + ((i % cols) + .5) * cell, oy + (((i / cols) | 0) + .5) * cell];

        function newGame() {
            S = { pts: 0, buys: 0, wide: new Set(), adj: new Map(), span: new Map(), blocked: new Set(), b: [], bAt: new Map(), cars: [], stock: diff === 'dev' ? DEV_STOCK : 24, hold: 0, alert: false, uo: new Set(), tun: null, score: 0, week: 1, t: 0, wt: 0, sp: 5, colors: 0, over: false, paused: true }; // 開始時は一時停止（道路を引いたりして準備できる）
            for (let k = 0; k < 2; k++) {
                const cx = cols * (.2 + Math.random() * .6), cy = rows * (.2 + Math.random() * .6), rx = 1.3 + Math.random() * 1.8, ry = 1 + Math.random() * 1.6;
                for (let y = 0; y < rows; y++)for (let x = 0; x < cols; x++)if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1) S.blocked.add(y * cols + x);
            }
            fillPockets();
            addPair();
            if (diff === 'dev') { for (let c = 1; c < COLORS.length; c++)addPair(); for (let g = 0; S.b.filter(b => b.type === 'h').length < DEV_HOUSES && g < 500; g++)if (!addMore()) break } // パズルモードは全4色と建物がある程度建った状態から始める
            setPauseIcon(); office = -1; lastOf = ''; tun1 = -1; tunnel = false; $('tn').classList.remove('on');
        }
        // 水と盤面の端だけで囲まれた、何もできない小さな陸地を水にして埋める
        function fillPockets() {
            const seen = new Set();
            for (let i = 0; i < cols * rows; i++) {
                if (S.blocked.has(i) || seen.has(i)) continue;
                const comp = [i], q = [i]; seen.add(i);
                for (let h = 0; h < q.length; h++)for (const m of nb(q[h])) if (!S.blocked.has(m) && !seen.has(m)) { seen.add(m); q.push(m); comp.push(m) }
                if (comp.length < 4) for (const c of comp) S.blocked.add(c);
            }
        }
        // 建物のまわりに道路をつなげる空きマスが残るか（囲まれて詰むのを防ぐ）
        const nbFree = i => nb(i).filter(m => !S.blocked.has(m) && !S.bAt.has(m)).length;
        function accessOK(i) {
            if (nbFree(i) < 2) return false;
            for (const m of nb(i)) if (S.bAt.has(m) && nbFree(m) - 1 < 2) return false;
            return true;
        }
        function pick(ok, lv) {
            const { deck } = bridgeSets(); // 橋の下のマスには建てない
            for (let L = lv || 0; L < 3; L++) {
                const c = [];
                for (let y = 1; y < rows - 1; y++)for (let x = 1; x < cols - 1; x++) {
                    const i = y * cols + x;
                    if (S.blocked.has(i) || S.adj.has(i) || deck.has(i) || S.bAt.has(i) || !ok(x, y) || !accessOK(i)) continue;
                    if (L < 2 && S.b.some(b => L === 0 ? (Math.abs(b.x - x) <= 1 && Math.abs(b.y - y) <= 1) : (Math.abs(b.x - x) + Math.abs(b.y - y) <= 1))) continue;
                    c.push(i);
                }
                if (c.length) return c[(Math.random() * c.length) | 0];
            } return -1;
        }
        // 反対側(家↔オフィス)の同色の建物と道でつながっているか
        function isConn(b) {
            const seen = new Set([b.id]), q = [b.id];
            for (let h = 0; h < q.length; h++) {
                for (const m of S.adj.get(q[h]) || []) {
                    const t = S.bAt.get(m);
                    if (t) { if (t.c === b.c && t.type !== b.type) return true; continue }
                    if (!seen.has(m)) { seen.add(m); q.push(m) }
                }
            } return false;
        }
        function add(type, c, i) { const b = { id: i, x: i % cols, y: (i / cols) | 0, type, c, pins: 0, out: 0, pt: 4 + Math.random() * 3, cd: 0, pulse: 0, lv: type === 'd' && diff === 'dev' ? 4 : 1, conn: false }; S.b.push(b); S.bAt.set(i, b); return b }
        function addPair() {
            const first = S.colors === 0, c = S.colors;
            const mid = (x, y) => !first || (x > cols * .25 && x < cols * .75 && y > rows * .25 && y < rows * .75);
            const hi = pick(mid); if (hi < 0) return false;
            add('h', c, hi); const hx = hi % cols, hy = (hi / cols) | 0;
            let di = pick((x, y) => mid(x, y) && Math.abs(x - hx) + Math.abs(y - hy) >= (first ? 4 : 7));
            if (di < 0) di = pick(() => true);
            if (di < 0) { S.b.pop(); S.bAt.delete(hi); return false }
            add('d', c, di); S.colors++; return true;
        }
        function tryPend() { if (S.pend && addPair()) { S.pend = false; toast('新しい色が登場') } }
        function addMore() {
            let c = (Math.random() * S.colors) | 0;
            for (let k = 0; k < S.colors; k++)if (!S.b.some(b => b.c === k && b.type === 'd')) { c = k; break }
            const h = S.b.filter(b => b.c === c && b.type === 'h').length, d = S.b.filter(b => b.c === c && b.type === 'd').length;
            const i = pick(() => true); if (i < 0) return false; add(h >= d * HOUSES_PER_OFFICE ? 'd' : 'h', c, i); return true;
        }
        // 引いた線(辺)だけをたどる。goal は建物。最初の一歩のセルを返す
        function nextStep(start, goal, av) {
            const prev = new Map([[start, -1]]), q = [start];
            for (let h = 0; h < q.length; h++) {
                const n = q[h];
                for (const m of S.adj.get(n) || []) {
                    if (m === goal.id) {
                        if (n === start) return m;
                        let cur = n; while (prev.get(cur) !== start) cur = prev.get(cur); return cur;
                    }
                    if (!prev.has(m) && !S.bAt.has(m) && !(av && av(m))) { prev.set(m, n); q.push(m) }
                }
            } return -1;
        }
        // 同じ色の目的地から、距離と混雑を見て行き先を選ぶ
        function pickDest(start, c) {
            const dist = new Map([[start, 0]]), q = [start]; let best = null, bs = 1e9;
            for (let h = 0; h < q.length; h++) {
                const n = q[h];
                for (const m of S.adj.get(n) || []) {
                    const bb = S.bAt.get(m);
                    if (bb) {
                        if (bb.type === 'd' && bb.c === c) {
                            const load = S.cars.filter(o => o.d === bb && !o.ret).length, s = dist.get(n) + 1 + 3 * load + (bb.busy > 0 ? 1 : 0);
                            if (s < bs) { bs = s; best = bb }
                        }
                        continue;
                    }
                    if (!dist.has(m)) { dist.set(m, dist.get(n) + 1); q.push(m) }
                }
            } return best;
        }
        function update(dt) {
            S.t += dt; S.wt += dt;
            if (diff !== 'dev' && S.wt >= 24) {
                S.wt = 0; S.week++; S.stock = capStock(S.stock + 8); toast('第' + S.week + '週：道路 +8');
                if (S.week % 2 === 0 && S.colors < COLORS.length) { S.pend = true; tryPend() }
            }
            if (diff !== 'dev') { S.sp -= dt; if (S.sp <= 0) { addMore(); tryPend(); S.sp = Math.max(3.5, 8 - S.t / 70) } } // パズルモードは建物が増えない
            if (diff === 'dev') {
                S.alert = S.b.some(b => b.type === 'h' && b.pins >= MAXP);
                S.hold = !S.alert && S.t >= DEV_WARM ? S.hold + dt : 0; if (S.hold >= CLEAR_HOLD) return devClear()

        function widen(c) {
            if (!S.adj.has(c) || S.bAt.has(c) || S.wide.has(c)) return;
            if (!pay(WIDE_COST)) { toast('ポイント不足：拡幅は1マス' + WIDE_COST + 'ptです'); return }
            S.wide.add(c);
        }
        // 橋どうしが重ならないための判定用（橋の下のマスと両端）
        function bridgeSets() {
            const deck = new Set(), ends = new Set();
            for (const k of S.span.keys()) {
                if (S.tun && k === S.tun.key) continue; // トンネルは橋の板にしない
                const [a, b] = k.split('_').map(Number), ax = a % cols, ay = (a / cols) | 0, bx = b % cols, by = (b / cols) | 0;
                const n = Math.abs(bx - ax) + Math.abs(by - ay), sx = Math.sign(bx - ax), sy = Math.sign(by - ay);
                ends.add(a); ends.add(b);
                for (let i = 1; i < n; i++)deck.add((ay + i * sy) * cols + ax + i * sx);
            }
            return { deck, ends };
        }
        function walk(a, b) {
            if (a < 0) return b;
            const ob = c => !S.bAt.has(c) && (S.blocked.has(c) || S.adj.has(c));
            let x = a % cols, y = (a / cols) | 0; const tx = b % cols, ty = (b / cols) | 0;
            while (x !== tx || y !== ty) {
                const p = y * cols + x; let dx = 0, dy = 0;
                if (Math.abs(tx - x) >= Math.abs(ty - y)) dx = Math.sign(tx - x); else dy = Math.sign(ty - y);
                x += dx; y += dy; const q = y * cols + x;
                if (mode === 'erase') { cut(p); cut(q); continue }
                if (wide) { widen(q); continue }
                if (bridge && ob(q)) {
                    // 道や湖を飛び越える（最大3マス、パズルモードは5マス）。着地点は空きマスか建物
                    let nx = x, ny = y, len = 1;
                    while (nx >= 0 && ny >= 0 && nx < cols && ny < rows && ob(ny * cols + nx) && len <= (diff === 'dev' ? 5 : 3)) { nx += dx; ny += dy; len++ }
                    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || ob(ny * cols + nx)) return p;
                    const r = ny * cols + nx, { deck, ends } = bridgeSets(), px = x - dx, py = y - dy;
                    let bad = deck.has(p) || deck.has(r);
                    for (let k = 1; k < len; k++) { const c = (py + k * dy) * cols + px + k * dx; if (deck.has(c) || ends.has(c)) bad = true }
                    if (bad) return p;
                    link(p, r, len); return r;
                }
                link(p, q);
            }
            return y * cols + x;
        }
        cv.addEventListener('pointerdown', e => {
            if (!running || S.over) return;
            if (tunnel) { const i = cellAt(e); if (i >= 0) tunnelPick(i); return }
            if (office >= 0) { const i = cellAt(e); if (i >= 0) placeOffice(i); return }
            cv.setPointerCapture(e.pointerId); down = true; mode = (eraser || e.button === 2) ? 'erase' : 'draw';
            lastC = cellAt(e); startC = lastC; moved = false; if (lastC >= 0 && mode === 'erase') cut(lastC); if (lastC >= 0 && wide) widen(lastC);
        });
        cv.addEventListener('pointermove', e => {
            hover = cellAt(e);
            if (!down) return;
            if (hover >= 0) { if (hover !== startC) moved = true; lastC = walk(lastC, hover) }
        });
        function tapCell(i) {
            const d = S.bAt.get(i); if (!d || d.type !== 'd' || S.over) return;
            if (d.lv >= 4) { toast('このオフィスは最大レベルです'); return }
            const c = UPC[d.lv - 1];
            if (!pay(c)) { toast('ポイント不足：強化にはあと' + (c - S.pts) + 'pt必要です'); return }
            d.lv++; d.pulse = 1; toast('オフィス強化 Lv' + d.lv + '：降車が速くなりました');
        }
        const stop = () => { down = false; lastC = -1 };
        cv.addEventListener('pointerup', () => { if (down && !moved && startC >= 0 && mode === 'draw' && !wide && !bridge) tapCell(startC); stop() });
        cv.addEventListener('pointercancel', stop);
        cv.addEventListener('pointerleave', () => { if (!down) hover = -1 });
        cv.addEventListener('contextmenu', e => e.preventDefault());

        function setEraser(v) { eraser = v; $('er').classList.toggle('on', v); if (v) { setWide(false); setBridge(false); office = -1; offTunnel() } }
        function setWide(v) { wide = v; $('wd').classList.toggle('on', v); if (v) { setEraser(false); setBridge(false); office = -1; offTunnel() } }
        function setBridge(v) { bridge = v; $('br').classList.toggle('on', v); if (v) { setEraser(false); setWide(false); office = -1; offTunnel() } }
        const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
        const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
        function setPauseIcon() { const p = S && S.paused; $('pa').classList.toggle('on', !!p); $('pa').innerHTML = p ? ICON_PLAY : ICON_PAUSE; $('pa').setAttribute('aria-label', p ? '再開' : '一時停止'); $('pa').title = p ? '再開' : '一時停止' }
        function setPause() { if (!S || S.over || !running) return; S.paused = !S.paused; setPauseIcon() }
        $('er').onclick = () => setEraser(!eraser);
        $('wd').onclick = () => setWide(!wide);
        $('br').onclick = () => setBridge(!bridge);
        $('by').onclick = buyRoads;
        $('pa').onclick = setPause;
        function restart() { newGame(); started = true; running = true; $('ov').classList.add('hide'); $('rs').classList.add('hide') }
        function applyMode() {
            const dev = diff === 'dev'; $('by').classList.toggle('hide', dev); $('wd').classList.toggle('hide', dev); $('tn').classList.toggle('hide', !dev); if (dev) setWide(false); $('stP').classList.toggle('hide', dev);
            $('wd').textContent = '拡幅（' + WIDE_COST + 'pt）'; $('er').textContent = dev ? '消す' : '消す（1pt）'; $('stS').classList.toggle('hide', dev); $('stC').classList.toggle('hide', !dev); refreshOffice()
        }
        function begin(d) { diff = d; applyMode(); resize(); restart() }
        $('dn').onclick = () => begin('normal'); $('dv').onclick = () => begin('dev'); $('rs').onclick = restart;
        $('vw').onclick = () => { $('ov').classList.add('hide'); $('rs').classList.remove('hide') };
        addEventListener('resize', resize);
        new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        matchMedia('(prefers-color-scheme:dark)').addEventListener('change', readTheme);
        resize(); newGame(); requestAnimationFrame(loop);
    </script>
</body>
