<!doctype html>
<html lang="ja">

<head>
   <!-- Google Analytics -->
   <script async src="https://www.googletagmanager.com/gtag/js?id=G-XKL20YHCTB"></script>
   <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XKL20YHCTB');
   </script>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
   <meta name="theme-color" content="#ffffff">
   <title>ブラウザゲームス｜無料・インストール不要で遊べるブラウザゲーム。モバイルにも対応</title>
   <meta name="description" content="
    無料で遊べるブラウザゲームポータル。パズルゲームからシミュレーションゲームまで、インストール不要でスマホ・PCからすぐにプレイできます。
    ">
   <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
   <style>
      :root {
         box-sizing: border-box;
         color-scheme: light;
         padding-top: env(safe-area-inset-top, 0px);
         padding-bottom: env(safe-area-inset-bottom, 0px);
         --bg: #fff;
         --ink: #1f2a30;
         --sub: #667780;
         --line: #e3e8eb;
         --chip: #f1f4f6;
         --accent: #2f6fd0
      }

      html {
         scroll-padding-top: env(safe-area-inset-top, 0px)
      }

      body {
         margin: 0;
         min-height: 100vh;
         background: var(--bg);
         color: var(--ink);
         font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif
      }

      main {
         max-width: 640px;
         margin: 0 auto;
         padding: 32px 18px 40px
      }

      h1 {
         margin: 0 0 4px;
         font-size: 26px
      }

      .lead {
         margin: 0 0 24px;
         font-size: 14px;
         color: var(--sub);
         line-height: 1.7
      }

      #list {
         display: grid;
         gap: 12px
      }

      .g {
         display: flex;
         align-items: center;
         gap: 12px;
         background: #fff;
         border: 1px solid var(--line);
         border-radius: 16px;
         padding: 16px 18px;
         color: inherit;
         text-decoration: none;
         box-shadow: 0 1px 3px rgba(20, 40, 50, .05);
         transition: border-color .15s, box-shadow .15s
      }

      .g:hover {
         border-color: var(--accent);
         box-shadow: 0 3px 10px rgba(20, 40, 50, .08)
      }

      .g:focus-visible {
         outline: 3px solid var(--accent);
         outline-offset: 3px
      }

      .bd {
         flex: 1;
         min-width: 0
      }

      .top {
         display: flex;
         align-items: center;
         flex-wrap: wrap;
         gap: 8px;
         margin-bottom: 4px
      }

      .top h2 {
         margin: 0;
         font-size: 19px
      }

      .tg {
         background: var(--chip);
         border-radius: 999px;
         padding: 1px 10px;
         font-size: 12px;
         font-weight: 700;
         color: var(--sub)
      }

      .bd p {
         margin: 0;
         font-size: 13px;
         line-height: 1.7;
         color: var(--sub)
      }

      .go {
         flex: none;
         font-size: 26px;
         line-height: 1;
         color: var(--accent)
      }

      footer {
         margin-top: 28px;
         font-size: 12px;
         color: var(--sub)
      }

      @media (prefers-reduced-motion:reduce) {
         .g {
            transition: none
         }
      }
   </style>
</head>

<body>
   <main>
      <h1>ブラウザゲームス by Gakuapu</h1>
      <p class="lead">無料・インストール不要ですぐに遊べるブラウザゲームです。モバイルにも完全対応</p>
      <div id="list"></div>
   </main>
   <script>
      /* ゲームを追加するときは、この配列に1件足すだけ。
         href: ゲームのHTMLへのパス / tag: ジャンル */
      const GAMES = [
         { href: 'index_yakyu.html', title: '野球シム', tag: 'シミュレーション', desc: '高校野球部のとプロ野球チームの2つの運営シミュレーションから選んで遊びます。' },
         { href: 'color-factory.html', title: 'カラーファクトリー', tag: 'パズル', desc: '色の玉を生産・加工して、納品する工場物流パズル。コンベヤーと装置をつなぎ、クリアを目指します。' },
         { href: 'douro-tsunagi.html', title: '道路つなぎ', tag: 'パズル', desc: '渋滞対策をしながらオフィスと家を道路でつなぐ交通ゲーム。ノーマルとパズルの2モードがあります。' }
      ];
      document.getElementById('list').innerHTML = GAMES.map(g =>
         `<a class="g" href="${g.href}"><div class="bd"><div class="top"><h2>${g.title}</h2><span class="tg">${g.tag}</span></div><p>${g.desc}</p></div><span class="go" aria-hidden="true">›</span></a>`
      ).join('');
   </script>
</body>

</html>
